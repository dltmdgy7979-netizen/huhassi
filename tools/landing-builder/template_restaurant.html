<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:description" content="광주 동구 작은 한식당. 매일 아침 끓이는 국과 제철 반찬.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" media="print" onload="this.media='all'">

<style>
/* ============================================================
   디자인 토큰
   ============================================================ */
:root{
  --primary:#C0452C;          /* 업종 색 방향: 음식 색에서 가져온 따뜻한 1색 */
  --primary-deep:#9A3620;
  --primary-soft:#FBEDE8;
  --primary-shadow:rgba(192,69,44,.25);
  --ink:#1B1714;
  --ink-2:#4A423C;
  --ink-3:#6F655E;
  --line:#E8E0D8;
  --bg:#FAF7F3;
  --card:#FFFFFF;
  --ok:#1F7A4D;
  --ok-soft:#E8F5EE;
  --warn:#9A5B10;
  --warn-soft:#FDF2DF;
  --off:#6B625C;
  --off-soft:#F0ECE7;
  --radius:18px;
  --radius-sm:12px;
  --shadow-s:0 1px 2px rgba(27,23,20,.05), 0 2px 8px rgba(27,23,20,.04);
  --shadow-m:0 2px 6px rgba(27,23,20,.06), 0 12px 32px rgba(27,23,20,.07);
  --maxw:720px;
  --pad:22px;
  /* 제목 글꼴. 점주가 '명조'를 고르면 자바스크립트가 명조로 바꾼다 */
  --font-title:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  --sec-gap:72px;
}
@media (min-width:768px){ :root{ --sec-gap:92px; --pad:32px; } }

/* 섹션이 적을 때는 간격을 줄인다 (내용이 적을수록 구멍처럼 보이므로) */
body.lean{ --sec-gap:48px; }
@media (min-width:768px){ body.lean{ --sec-gap:64px; } }

/* 어두운 화면 */
@media (prefers-color-scheme:dark){
  :root{
    --ink:#F3EEE9; --ink-2:#BCB3AB; --ink-3:#9C928A;
    --line:#332D29; --bg:#141110; --card:#1C1917;
    --ok:#4FBF88; --ok-soft:#15291F;
    --warn:#D9A24E; --warn-soft:#2A2013;
    --off:#99908A; --off-soft:#231F1C;
    --shadow-s:0 1px 2px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.22);
    --shadow-m:0 2px 6px rgba(0,0,0,.38), 0 12px 32px rgba(0,0,0,.3);
  }
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.7; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
  /* 한국어는 이게 없으면 단어 중간에서 줄이 끊긴다 ("올립/니다") */
  word-break:keep-all; overflow-wrap:break-word;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
@media (min-width:768px){ body{ padding-bottom:0; } }
img{ max-width:100%; display:block; }
a{ color:inherit; }
button{ font:inherit; color:inherit; }

/* ============================================================
   타이포 위계 (4단계)
   ============================================================ */
body[data-title-font="serif"]{
  --font-title:"Noto Serif KR","Pretendard Variable",Pretendard,serif;
}
.t-hero{ font-family:var(--font-title); font-size:clamp(32px,8.4vw,52px); line-height:1.18; letter-spacing:-.035em; font-weight:800; margin:0; }
.t-sec{ font-family:var(--font-title); font-size:clamp(24px,6.6vw,30px); line-height:1.3; letter-spacing:-.028em; font-weight:750; margin:0; }
/* 명조는 획이 가늘어 같은 굵기로도 더 가벼워 보인다. 한 단계 올린다 */
body[data-title-font="serif"] .t-hero{ font-weight:700; letter-spacing:-.03em; }
body[data-title-font="serif"] .t-sec{ font-weight:600; letter-spacing:-.022em; }
.t-body{ font-size:16px; line-height:1.75; color:var(--ink-2); }
.t-cap{ font-size:13px; line-height:1.6; color:var(--ink-3); letter-spacing:-.005em; }
.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 var(--pad); }

/* ============================================================
   섹션 공통 + 페이드인
   ============================================================ */
section{ margin-top:var(--sec-gap); scroll-margin-top:66px; }

/* 색이 다른 띠 — 같은 배경이 끝까지 이어지면 밋밋해 보인다 */
section.band{
  padding:calc(var(--sec-gap) * .68) 0;
  background:var(--card);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
}
.sec-head{ margin-bottom:18px; }
.sec-head .eyebrow{
  display:block; font-size:12px; font-weight:700; letter-spacing:.14em;
  color:var(--primary-text, var(--primary)); text-transform:uppercase; margin-bottom:9px;
}
.reveal{ opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1); }
.reveal.in{ opacity:1; transform:none; }
@media (prefers-reduced-motion:reduce){ .reveal{ opacity:1; transform:none; transition:none; } html{ scroll-behavior:auto; } }

/* ============================================================
   미리보기 리본 (빌더에서 받은 파일에는 나오지 않음)
   ============================================================ */
.demo-ribbon{
  background:#2B2420; color:#F6EFE8; text-align:center;
  font-size:12.5px; padding:9px 16px; letter-spacing:-.01em;
}
.demo-ribbon b{ color:#FFD9A0; font-weight:700; }

/* ============================================================
   히어로
   ============================================================ */
.hero{ position:relative; margin-top:0; overflow:hidden; }
.hero.has-photo{ padding-top:0; }
.hero.has-photo::before{
  content:""; position:absolute; inset:0 0 auto; height:420px;
  background:
    radial-gradient(120% 90% at 88% 0%, var(--primary-soft) 0%, transparent 62%),
    linear-gradient(180deg, var(--card) 0%, var(--bg) 100%);
  z-index:-1;
}
/* 사진이 없을 때: 빈 사진칸을 두지 않고, 색 있는 패널과 큰 글자로 첫 화면을 세운다 */
.hero.no-photo .hero-panel{
  background:linear-gradient(168deg, var(--primary-soft) 0%, var(--bg) 94%);
  border-bottom:1px solid var(--line);
  padding:40px 0 40px;
}
.hero.no-photo .t-hero{ font-size:clamp(38px,11.2vw,62px); letter-spacing:-.04em; }
.hero.no-photo .tagline{ font-size:clamp(16.5px,4.4vw,19.5px); max-width:26ch; }
.hero.no-photo .hero-actions{ margin-top:22px; }
.hero-logo{ width:54px; height:54px; border-radius:14px; object-fit:cover; box-shadow:var(--shadow-s); margin-bottom:12px; }
.status{
  display:inline-flex; align-items:center; gap:8px;
  padding:7px 14px 7px 12px; border-radius:999px;
  font-size:13.5px; font-weight:650; letter-spacing:-.015em;
  background:var(--off-soft); color:var(--off); margin-bottom:12px;
}
.status .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }
.status.is-open{ background:var(--ok-soft); color:var(--ok); }
.status.is-open .dot{ box-shadow:0 0 0 0 rgba(31,122,77,.5); animation:pulse 2.4s infinite; }
.status.is-break{ background:var(--warn-soft); color:var(--warn); }
@keyframes pulse{ 70%{ box-shadow:0 0 0 7px rgba(31,122,77,0); } 100%{ box-shadow:0 0 0 0 rgba(31,122,77,0); } }

.hero h1{ margin:0; }
.hero .tagline{ margin:10px 0 0; font-size:clamp(15.5px,4.1vw,18px); color:var(--ink-2); line-height:1.65; max-width:30ch; }
/* 버튼이 하나뿐이면 가로로 꽉 채운다. 반만 차 있으면 허전해 보인다 */
.hero-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
.hero-actions .btn:only-child{ flex:1 1 100%; }
@media (max-width:767px){ .hero-actions .btn{ flex:1 1 auto; } }

/* 사진이 있으면 첫 화면을 사진이 통째로 채우고, 그 위에 상호와 영업 상태를 얹는다 */
.hero-cover{ position:relative; height:clamp(300px, 52vh, 440px); overflow:hidden; background:var(--primary-soft); }
.hero-cover > img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.hero-veil{
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.76) 0%, rgba(0,0,0,.44) 40%, rgba(0,0,0,.06) 100%);
}
.hero-over{ position:absolute; left:0; right:0; bottom:0; padding-bottom:20px; }
.hero-over .t-hero{ color:#fff; text-shadow:0 1px 16px rgba(0,0,0,.4); }
.hero-over .tagline{ color:rgba(255,255,255,.92); margin-top:8px; text-shadow:0 1px 10px rgba(0,0,0,.4); }
.hero-over .status{ margin-bottom:10px; box-shadow:0 2px 10px rgba(0,0,0,.22); }
.hero-logo.on-photo{ width:48px; height:48px; border-radius:13px; margin-bottom:10px; box-shadow:0 3px 12px rgba(0,0,0,.35); }
.hero-below{ padding-top:18px; }
.hero.no-photo + section.band{ margin-top:0; border-top:0; }
.hero.has-photo + section.band{ margin-top:30px; }
.hero-below .hero-actions{ margin-top:0; }

/* 긴급 공지 */
.notice{
  margin-top:26px; background:var(--primary-soft); border:1px solid var(--line);
  border-left:4px solid var(--primary); border-radius:var(--radius-sm);
  padding:16px 18px;
}
.notice .nt{ font-weight:700; font-size:15px; color:var(--primary-deep); letter-spacing:-.02em; }
.notice .nb{ margin-top:5px; font-size:14.5px; color:var(--ink-2); line-height:1.6; }

/* ============================================================
   버튼
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:0 20px; border-radius:13px;
  font-size:15.5px; font-weight:680; letter-spacing:-.018em;
  text-decoration:none; border:1px solid transparent; cursor:pointer;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{ transform:scale(.975); }
.btn-primary{ background:var(--primary-btn, var(--primary)); color:var(--on-primary, #fff); box-shadow:0 2px 10px var(--primary-shadow); }
.btn-primary:hover{ background:var(--primary-deep); }
.btn-ghost{ background:var(--card); color:var(--ink); border-color:var(--line); box-shadow:var(--shadow-s); }
.btn-ghost:hover{ border-color:#D6CCC2; }
.btn-sm{ min-height:40px; padding:0 14px; font-size:13.5px; border-radius:11px; }
.btn svg{ width:17px; height:17px; flex:none; }

/* 위쪽 차례 막대 — 스크롤하면 나타난다 */
.topnav{
  position:fixed; top:0; left:0; right:0; z-index:35;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line);
  transform:translateY(-101%); transition:transform .28s cubic-bezier(.2,.8,.3,1);
}
.topnav.show{ transform:none; }
.topnav:not(.show){ visibility:hidden; }
.topnav .nav-in{
  max-width:var(--maxw); margin:0 auto; padding:13px var(--pad);
  display:flex; gap:20px; overflow-x:auto; scrollbar-width:none;
}
.topnav .nav-in::-webkit-scrollbar{ display:none; }
.topnav a{
  display:inline-flex; align-items:center; min-height:44px;
  font-size:14px; font-weight:650; letter-spacing:-.02em;
  color:var(--ink-2); text-decoration:none; white-space:nowrap;
}
.topnav a:hover{ color:var(--primary-text, var(--primary)); }

/* ============================================================
   메뉴 / 가격표
   ============================================================ */
/* 대표 메뉴에 사진이 있으면 큰 카드로 먼저 보여준다 */
.m-cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
@media (max-width:430px){ .m-cards{ grid-template-columns:1fr; } }
.m-card{
  border-radius:var(--radius); overflow:hidden; background:var(--card);
  border:1px solid var(--line); box-shadow:var(--shadow-s);
}
.m-card img{ width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--primary-soft); display:block; }
.m-card .c-body{ padding:13px 15px 15px; }
.m-card .c-name{ font-size:16.5px; font-weight:700; letter-spacing:-.024em; }
.m-card .c-price{ margin-top:5px; font-size:17px; font-weight:750; color:var(--primary-text, var(--primary)); letter-spacing:-.02em; }
.m-card .c-note{ margin-top:6px; font-size:13px; color:var(--ink-3); line-height:1.55; }

/* 가게 한마디 — 사진이 없어도 한 화면을 채우는 장치 */
.quote{ text-align:center; }
.quote .mark{
  font-family:Georgia,"Times New Roman",serif; font-size:46px; line-height:.9;
  color:var(--primary-text, var(--primary)); opacity:.32; display:block; margin-bottom:2px;
}
.quote .q{
  font-family:var(--font-title); font-weight:600;
  font-size:clamp(20px,5.4vw,28px); line-height:1.6; letter-spacing:-.028em;
  color:var(--ink); margin:0 auto; max-width:24ch;
  word-break:keep-all;
}
.quote .by{ margin-top:16px; font-size:13.5px; color:var(--ink-3); letter-spacing:-.01em; }

.menu-list{ display:flex; flex-direction:column; gap:0; }
.m-item{
  display:flex; gap:14px; align-items:flex-start;
  padding:17px 0; border-bottom:1px solid var(--line);
}
.m-item:first-child{ border-top:1px solid var(--line); }
.m-item.is-signature{ background:linear-gradient(90deg, var(--primary-soft), transparent 72%); }
.m-thumb{ width:76px; height:76px; border-radius:var(--radius-sm); object-fit:cover; flex:none; background:var(--primary-soft); }
.m-main{ flex:1 1 auto; min-width:0; }
.m-top{ display:flex; align-items:baseline; gap:10px; }
.m-name{ font-size:16.5px; font-weight:680; letter-spacing:-.022em; flex:1 1 auto; }
.m-price{ font-size:16.5px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; }
.m-note{ margin-top:4px; font-size:13.5px; color:var(--ink-3); line-height:1.55; }
.badge{
  display:inline-block; vertical-align:2px; margin-right:6px;
  font-size:11px; font-weight:750; letter-spacing:.02em;
  color:var(--on-primary, #fff); background:var(--primary-btn, var(--primary)); padding:2.5px 7px; border-radius:6px;
}
.price-note{ margin-top:16px; font-size:12.5px; color:var(--ink-3); }

.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; }
.chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:8px 14px; font-size:13.5px; font-weight:600; color:var(--ink-2);
  box-shadow:var(--shadow-s); text-decoration:none; white-space:nowrap;
  transition:transform .12s ease;
}
.chip:active{ transform:scale(.97); }

/* 원산지 */
.origin{ margin-top:24px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--card); overflow:hidden; }
.origin summary{
  cursor:pointer; padding:14px 18px; font-size:14px; font-weight:650;
  list-style:none; display:flex; justify-content:space-between; align-items:center;
}
.origin summary::-webkit-details-marker{ display:none; }
.origin summary::after{ content:"＋"; color:var(--ink-3); font-weight:400; }
.origin[open] summary::after{ content:"－"; }
.origin-body{ padding:0 18px 16px; }
.origin-row{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px dashed var(--line); font-size:14px; }
.origin-row span:last-child{ color:var(--ink-2); }

/* ============================================================
   갤러리
   ============================================================ */
.gal{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.gal img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:var(--radius-sm); background:var(--primary-soft); }
.gal.scroll{
  display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  padding:0 var(--pad) 6px; margin:0 calc(var(--pad) * -1);
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.gal.scroll::-webkit-scrollbar{ display:none; }
.gal.scroll img{ width:72%; max-width:300px; aspect-ratio:4/3; flex:none; scroll-snap-align:center; }

/* ============================================================
   사장님 소개 (책 페이지의 '저자 소개'에 해당)
   ============================================================ */
.owner{ display:flex; gap:18px; align-items:flex-start; }
.owner img{
  width:88px; height:88px; flex:none; border-radius:50%;
  object-fit:cover; box-shadow:var(--shadow-s); background:var(--primary-soft);
}
.owner .o-body{ flex:1 1 auto; min-width:0; }
.owner .o-name{ font-family:var(--font-title); font-size:19px; font-weight:700; letter-spacing:-.025em; }
.owner .o-role{ margin-top:3px; font-size:13px; color:var(--primary-text, var(--primary)); font-weight:650; }
.owner .o-text{ margin-top:11px; font-size:15.5px; line-height:1.75; color:var(--ink-2); }
@media (max-width:420px){
  .owner{ gap:14px; }
  .owner img{ width:70px; height:70px; }
}

/* ============================================================
   영업시간
   ============================================================ */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-s); padding:6px 20px; }
.hrow{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); font-size:15px; }
.hrow:last-child{ border-bottom:none; }
.hrow .d{ font-weight:650; min-width:3.2em; flex:none; white-space:nowrap; }
.hrow .v{ color:var(--ink-2); text-align:right; }
.hrow .v .sub{ display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px; }
.hrow.today{ color:var(--primary-deep); }
.hrow.today .d::after{ content:" 오늘"; font-size:11px; font-weight:700; letter-spacing:-.01em; }
.hrow.today .v{ color:var(--primary-deep); font-weight:650; }
.hrow.off .v{ color:var(--ink-3); }
.hnote{ margin-top:14px; font-size:13.5px; color:var(--ink-3); line-height:1.6; }

/* ============================================================
   오시는 길
   ============================================================ */
.place-card{ padding:20px; }
.addr{ font-size:17px; font-weight:650; letter-spacing:-.022em; line-height:1.55; }
.place-card .chips{ margin-top:14px; }
.map-img{ margin-top:18px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--line); }
.info-list{ margin:18px 0 0; padding:0; list-style:none; }
.info-list li{ display:flex; gap:11px; padding:9px 0; font-size:14.5px; color:var(--ink-2); border-top:1px solid var(--line); }
.info-list li span{ min-width:0; overflow-wrap:anywhere; }
.info-list li b{ color:var(--ink); font-weight:650; flex:none; min-width:4.6em; }

/* ============================================================
   후기
   ============================================================ */
.rev{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-s); margin-bottom:12px; }
.rev p{ margin:0; font-size:15.5px; line-height:1.7; color:var(--ink-2); }
.rev .meta{ margin-top:12px; font-size:12.5px; color:var(--ink-3); }

/* ============================================================
   문의 · 공유
   ============================================================ */
.contact-grid{ display:grid; gap:10px; }
@media (min-width:520px){ .contact-grid{ grid-template-columns:1fr 1fr; } }
.contact-grid .btn{ width:100%; min-width:0; overflow-wrap:anywhere; white-space:normal; text-align:center; }
.chip{ min-height:44px; }
.share{ display:flex; gap:9px; flex-wrap:wrap; margin-top:20px; }

/* ============================================================
   푸터
   ============================================================ */
footer{ margin-top:var(--sec-gap); padding:26px 0 22px; border-top:1px solid var(--line); }
footer .f-name{ font-size:15px; font-weight:700; letter-spacing:-.02em; }
footer .f-meta{ margin-top:8px; font-size:12.5px; color:var(--ink-3); line-height:1.75; }
footer .f-meta a{ color:var(--ink-3); text-decoration:underline; text-underline-offset:2px; }
footer .credit{ margin-top:16px; font-size:12px; color:var(--ink-3); }

/* ============================================================
   하단 스티키 CTA
   ============================================================ */
.sticky{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px) saturate(1.2);
  border-top:1px solid var(--line);
  display:flex; gap:9px; max-width:var(--maxw); margin:0 auto;
  transform:translateY(110%); transition:transform .32s cubic-bezier(.2,.8,.3,1);
}
.sticky.show{ transform:none; }
.sticky .btn{ flex:1 1 0; min-width:0; }
.sticky .btn.lead{ flex:1.5 1 0; }
.sticky .btn.k{ flex:0 0 52px; padding:0; background:#FEE500; border-color:#EFD200; color:#1B1600; }
.sticky .btn.k svg{ width:21px; height:21px; }
@media (min-width:768px){ .sticky{ display:none; } }

/* ============================================================
   따라다니는 연락 버튼
   ============================================================ */
.fab{
  position:fixed; right:14px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:45;
  display:flex; flex-direction:column; gap:10px;
}
@media (max-width:767px){
  .fab{ bottom:calc(74px + env(safe-area-inset-bottom)); }
  .sticky ~ .fab .f-kakao, .sticky ~ .fab .f-call{ display:none; }
}
.fab > *{
  width:52px; height:52px; border-radius:50%; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  box-shadow:0 4px 16px rgba(0,0,0,.16); text-decoration:none; cursor:pointer; padding:0;
  transition:transform .14s ease, opacity .25s ease;
  -webkit-tap-highlight-color:transparent;
}
.fab > *:active{ transform:scale(.92); }
.fab svg{ width:23px; height:23px; }
.fab .f-kakao{ background:#FEE500; border-color:#EFD200; color:#1B1600; }
.fab .f-call{ background:var(--primary-btn, var(--primary)); border-color:transparent; color:var(--on-primary, #fff); box-shadow:0 4px 16px var(--primary-shadow); }
.fab .f-top{ opacity:0; pointer-events:none; }
.fab .f-top.on{ opacity:1; pointer-events:auto; }
@media (prefers-reduced-motion:reduce){ .fab > *{ transition:none; } }

/* 박히는 지도 */
.map-embed{
  margin-top:16px; border-radius:var(--radius-sm); overflow:hidden;
  border:1px solid var(--line); background:var(--off-soft);
}
.map-embed iframe{ display:block; width:100%; height:250px; border:0; }
@media (min-width:768px){ .map-embed iframe{ height:320px; } }


/* 토스트 */
.toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); z-index:60;
  transform:translate(-50%,14px); opacity:0; pointer-events:none;
  background:#241E1A; color:#fff; font-size:13.5px; font-weight:600;
  padding:11px 18px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.2);
  transition:opacity .22s ease, transform .22s ease;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }
@media (min-width:768px){ .toast{ bottom:34px; } }

.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

.rev-lead{ margin:0; font-size:16px; color:var(--ink-2); line-height:1.75; max-width:34ch; }
.rev-more{ margin-top:18px; }

/* ============================================================
   간단히 남기기 — 서버에 저장하지 않고, 적은 내용을 문자·카톡 창으로 넘긴다
   ============================================================ */
.ask{ margin-top:22px; padding:20px; border-radius:var(--radius); background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow-s); max-width:720px; }
.ask-title{ font-size:17px; font-weight:750; letter-spacing:-.025em; }
.ask-sub{ margin:5px 0 2px; font-size:13.5px; color:var(--ink-3); line-height:1.6; }
.ask-f{ display:block; margin-top:13px; }
.ask-f span{ display:block; font-size:13.5px; font-weight:650; color:var(--ink-2); margin-bottom:6px; }
.ask-f input, .ask-f textarea{
  width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--bg);
  border:1px solid var(--line); border-radius:12px; padding:12px 14px; -webkit-appearance:none; appearance:none;
}
.ask-f textarea{ resize:vertical; min-height:108px; line-height:1.6; display:block; }
.ask-f input:focus, .ask-f textarea:focus{ outline:2px solid var(--primary-text, var(--primary)); outline-offset:1px; }
.ask-acts{ display:grid; gap:10px; margin-top:16px; }
.ask-acts .btn{ width:100%; }
@media (min-width:520px){ .ask-acts{ grid-template-columns:1fr 1fr; } .ask-acts .btn:only-child{ grid-column:1 / -1; } }

/* ============================================================
   PC 화면 (1024px 이상) — 휴대폰 화면을 늘린 것처럼 보이지 않게
   ============================================================ */
@media (min-width:1024px){
  :root{ --maxw:1080px; --pad:40px; --sec-gap:116px; }
  body.lean{ --sec-gap:88px; }
  .sec-head{ margin-bottom:32px; }
  .t-sec{ font-size:34px; }

  /* 첫 화면 */
  .hero-cover{ height:clamp(480px, 70vh, 660px); }
  .hero-veil{ background:linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,.42) 46%, rgba(0,0,0,.1) 100%); }
  .hero-over{ padding-bottom:48px; }
  .hero-over .t-hero{ font-size:66px; }
  .hero-over .tagline{ font-size:20px; max-width:36ch; margin-top:12px; }
  .hero-over .status{ font-size:14.5px; margin-bottom:14px; }
  .hero-below{ padding-top:28px; }
  .hero-actions .btn{ min-width:200px; min-height:56px; font-size:17px; }
  .hero-actions .btn:only-child{ flex:0 0 auto; }
  .hero.no-photo .hero-panel{ padding:92px 0 84px; }
  .hero.no-photo .t-hero{ font-size:76px; }
  .hero.no-photo .tagline{ font-size:21px; max-width:34ch; }
  .hero.has-photo + section.band{ margin-top:56px; }
  .quote .q{ font-size:33px; max-width:28ch; }
  section.band{ padding-top:76px; padding-bottom:76px; }

  /* 메뉴: 카드는 세 칸, 목록은 두 줄로 */
  .m-cards{ grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:22px; margin-bottom:36px; }
  .m-card .c-body{ padding:17px 19px 19px; }
  .menu-list{ display:grid; grid-template-columns:1fr 1fr; column-gap:64px; }

  /* 사진: 옆으로 넘기지 않고 한눈에 */
  .gal, .gal.scroll{ display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; overflow:visible; padding:0; margin:0; }
  .gal img, .gal.scroll img{ width:100%; max-width:none; aspect-ratio:4/3; }

  /* 사장님 소개 */
  .owner{ gap:34px; align-items:center; max-width:860px; margin:0 auto; }
  .owner .o-text{ font-size:17px; }

  /* 영업시간과 오시는 길을 나란히 */
  #app:has(> #sec-hours + #sec-place), #app:has(> #sec-place + #sec-hours){
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,540px) minmax(0,540px) minmax(0,1fr);
  }
  #app:has(> #sec-hours + #sec-place) > *, #app:has(> #sec-place + #sec-hours) > *{ grid-column:1 / -1; min-width:0; }
  #app > #sec-hours:has(+ #sec-place), #app > #sec-place:has(+ #sec-hours){ grid-column:2; }
  #app > #sec-hours + #sec-place, #app > #sec-place + #sec-hours{ grid-column:3; }
  #app > #sec-hours:has(+ #sec-place) > .wrap, #app > #sec-place:has(+ #sec-hours) > .wrap{ padding-right:24px; }
  #app > #sec-hours + #sec-place > .wrap, #app > #sec-place + #sec-hours > .wrap{ padding-left:24px; }

  .contact-grid{ max-width:720px; }
  .fab{ right:28px; bottom:28px; }
}

/* ============================================================
   분위기 '밤' — 손님 휴대폰 설정과 상관없이 짙은 바탕으로 고정
   (주점·바·저녁 장사처럼 밤 사진이 많은 가게용)
   ============================================================ */
html[data-mood="night"]{
  color-scheme:dark;
  --ink:#F6F1F3; --ink-2:#C6BCC2; --ink-3:#9F959B;
  --line:#2B252A; --bg:#0D0B0E; --card:#18151A;
  --ok:#4FBF88; --ok-soft:#15291F;
  --warn:#D9A24E; --warn-soft:#2A2013;
  --off:#99908A; --off-soft:#231F1C;
  --shadow-s:0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  --shadow-m:0 2px 6px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.4);
}
html[data-mood="night"] .btn-primary{ box-shadow:0 0 0 1px var(--primary-shadow), 0 10px 30px var(--primary-shadow); }
html[data-mood="night"] .hero-veil{ background:linear-gradient(to top, #0D0B0E 0%, rgba(13,11,14,.72) 34%, rgba(13,11,14,.12) 100%); }
html[data-mood="night"] .hero.has-photo::before{ display:none; }
html[data-mood="night"] .hero-over .t-hero{ text-shadow:0 0 34px var(--primary-shadow); font-size:clamp(34px,10.4vw,48px); }
html[data-mood="night"] section.band{
  background:radial-gradient(90% 120% at 50% 0%, var(--primary-soft) 0%, transparent 70%), var(--card);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
}

/* 칸 번호 — 01, 02 … 순서가 보이면 페이지가 '짜여진 것'으로 읽힌다 */
.sec-no{
  display:flex; align-items:center; gap:12px; margin-bottom:12px;
  font-size:12px; font-weight:700; letter-spacing:.2em; color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.sec-no::after{ content:""; width:34px; height:1px; background:var(--line); }

/* 사진 넘겨 보기 — 크게 한 장씩, 설명은 사진 위에 */
.gal.reel{
  display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  margin:0 calc(var(--pad) * -1); padding:0 var(--pad) 4px; scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.gal.reel::-webkit-scrollbar{ display:none; }
.gal.reel figure{
  position:relative; margin:0; flex:none; width:80%; max-width:340px; aspect-ratio:4/5;
  border-radius:var(--radius); overflow:hidden; scroll-snap-align:center;
  background:var(--primary-soft); box-shadow:var(--shadow-m);
}
.gal.reel figure img{ display:block; width:100%; height:100%; max-width:none; aspect-ratio:auto; object-fit:cover; border-radius:0; }
.gal.reel figcaption{
  position:absolute; inset:auto 0 0; padding:44px 16px 14px;
  background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,0));
  color:#fff; font-size:14.5px; font-weight:650; letter-spacing:-.015em; line-height:1.4;
}
.reel-dots{ display:flex; justify-content:center; gap:6px; margin-top:16px; }
.reel-dots i{ width:6px; height:6px; border-radius:99px; background:var(--line); transition:width .25s, background .25s; }
.reel-dots i.on{ width:20px; background:var(--primary); }
@media (prefers-reduced-motion:reduce){ .reel-dots i{ transition:none; } }

/* 전화 카드 — 번호를 크게. 문의 칸에서 가장 먼저 눈에 들어와야 한다 */
.call-card{
  display:block; text-align:center; text-decoration:none; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:26px 20px 20px; margin-bottom:10px; box-shadow:var(--shadow-s);
}
.call-card .cc-l{ display:block; font-size:13.5px; color:var(--ink-3); font-weight:600; }
.call-card .cc-n{
  display:block; margin:6px 0 16px; font-size:clamp(28px,8.6vw,40px); font-weight:800;
  letter-spacing:-.02em; line-height:1.15; font-variant-numeric:tabular-nums; overflow-wrap:anywhere;
}
.call-card .btn{ width:100%; pointer-events:none; }

/* 맨 아래 — 가게 이름을 크게 비쳐 놓는다 */
footer{ position:relative; overflow:hidden; }
footer .wrap{ position:relative; z-index:1; }
.f-ghost{
  position:absolute; right:-6px; bottom:-.24em; z-index:0; pointer-events:none; white-space:nowrap;
  font-family:var(--font-title); font-weight:800; font-size:clamp(64px,22vw,150px); line-height:1;
  letter-spacing:-.05em; color:var(--ink); opacity:.04; user-select:none;
}
/* 큰 이름이 맨 아래 글자와 겹치지 않게 그 높이만큼 자리를 비운다 */
footer:has(.f-ghost){ padding-bottom:clamp(64px, 19vw, 130px); }

@media (min-width:1024px){
  .gal.reel{ display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; overflow:visible; margin:0; padding:0; }
  .gal.reel figure{ width:100%; max-width:none; aspect-ratio:4/3; box-shadow:var(--shadow-s); }
  .reel-dots{ display:none; }
  .call-card{ max-width:720px; padding:34px 28px 26px; }
  .call-card .btn{ width:auto; min-width:240px; }
  .sec-no{ margin-bottom:16px; }
}

/* 가로로 꽉 차는 사진 띠 — 카드가 이어지는 중간에 숨 쉴 곳을 만든다 */
#sec-band{ position:relative; overflow:hidden; background:var(--primary-soft); }
#sec-band img{ display:block; width:100%; height:clamp(210px,60vw,340px); object-fit:cover; }
html[data-mood="night"] #sec-band::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to bottom, var(--bg) 0%, rgba(13,11,14,0) 22%, rgba(13,11,14,0) 78%, var(--bg) 100%);
}
@media (min-width:1024px){ #sec-band img{ height:clamp(380px,36vw,540px); } }
</style>
</head>

<script>
(function(){
"use strict";

/* ---------- 데이터 읽기 ---------- */
var SITE = {};
try { SITE = JSON.parse(document.getElementById("site-data").textContent) || {}; }
catch(e){ SITE = {}; }

var DAYS  = ["sun","mon","tue","wed","thu","fri","sat"];
var DAYKR = ["일","월","화","수","목","금","토"];

/* ---------- 유틸 ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function nl(s){ return esc(s).replace(/\n/g,"<br>"); }
function has(v){
  if (v == null) return false;
  if (typeof v === "string") return v.trim() !== "";
  if (Array.isArray(v)) return v.length > 0;
  return true;
}
/* 외부 링크는 http/https 만 허용 */
function safeUrl(u){
  if (!has(u)) return "";
  var s = String(u).trim();
  return /^https?:\/\//i.test(s) ? s : "";
}
function telUrl(p){ return "tel:" + String(p).replace(/[^0-9+]/g,""); }

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tid);
  t._tid = setTimeout(function(){ t.classList.remove("show"); }, 1900);
}
function copy(text, msg){
  var done = function(){ toast(msg || "복사했어요"); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ legacy(); });
  } else { legacy(); }
  function legacy(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ toast("복사하지 못했어요"); }
    document.body.removeChild(ta);
  }
}

/* 사진이 없을 때 쓰는 플레이스홀더 (가짜 음식 사진을 만들지 않습니다) */
function ph(kind){
  var p = (SITE.theme && SITE.theme.primary) || "#C0452C";
  var sq = (kind === "logo");
  var w = sq ? 120 : 400, h = sq ? 120 : 300;
  var sc = sq ? 0.62 : 1;
  var glyph = '<g transform="translate(' + (w/2) + ',' + (h/2) + ') scale(' + sc + ')" '
    + 'fill="none" stroke="' + p + '" stroke-opacity=".32" stroke-width="3" stroke-linecap="round">'
    + '<circle cx="0" cy="0" r="20"/><path d="M0 -31V31M-14 -24v11M14 -24v11"/></g>';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '">'
    + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="' + p + '" stop-opacity=".12"/>'
    + '<stop offset="1" stop-color="' + p + '" stop-opacity=".035"/></linearGradient></defs>'
    + '<rect width="' + w + '" height="' + h + '" fill="url(#g)"/>' + glyph + '</svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* 고른 색에서 진한 색·연한 색·그림자 색을 만들어 냅니다 */
function hex2rgb(h){
  var m = String(h || "").trim().replace("#", "");
  if (m.length === 3) m = m[0]+m[0]+m[1]+m[1]+m[2]+m[2];
  if (!/^[0-9a-f]{6}$/i.test(m)) return null;
  return [parseInt(m.slice(0,2),16), parseInt(m.slice(2,4),16), parseInt(m.slice(4,6),16)];
}
function mix(rgb, to, t){
  return "#" + rgb.map(function(v, i){
    var x = Math.round(v + (to[i] - v) * t);
    return ("0" + Math.max(0, Math.min(255, x)).toString(16)).slice(-2);
  }).join("");
}
function isNight(){ return !!(SITE.theme && SITE.theme.mood === "night"); }
function isDark(){
  if (isNight()) return true;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function applyTheme(){
  if (isNight()) document.documentElement.setAttribute("data-mood", "night");
  else document.documentElement.removeAttribute("data-mood");
  var tf = (SITE.theme && SITE.theme.titleFont) || "serif";
  document.body.setAttribute("data-title-font", tf === "sans" ? "sans" : "serif");

  var hex = (SITE.theme && SITE.theme.primary) || "";
  var rgb = hex2rgb(hex);
  if (!rgb) return;
  var r = document.documentElement.style, dark = isDark();

  /* 어두운 화면에서는 진한 색을 오히려 밝게, 연한 색을 어둡게 만들어야 읽힙니다 */
  r.setProperty("--primary-deep", dark ? mix(rgb, [255,255,255], 0.34) : mix(rgb, [0,0,0], 0.24));
  r.setProperty("--primary-soft", dark ? mix(rgb, [20,17,16], 0.84)    : mix(rgb, [255,255,255], 0.90));
  r.setProperty("--primary-shadow", "rgba(" + rgb.join(",") + (dark ? ",.34)" : ",.25)"));

  /* 고른 색으로 글자가 읽히는지 스스로 확인하고, 안 읽히면 조금씩 옮긴다 */
  function lum(c){ var a = c.map(function(v){ v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126*a[0] + .7152*a[1] + .0722*a[2]; }
  function ratio(a, b){ var x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
  function step(c, to, t){ return c.map(function(v, i){ return Math.round(v + (to[i] - v) * t); }); }
  function css(c){ return "rgb(" + c.join(",") + ")"; }
  var W = [255,255,255], K = [27,23,20], i;
  if (ratio(rgb, K) >= 7){                       /* 밝은 색(노랑 등): 단추 글자를 어둡게 */
    r.setProperty("--on-primary", "#1B1714"); r.setProperty("--primary-btn", hex);
  } else {                                        /* 그 밖: 흰 글자가 읽힐 때까지 단추 바탕을 조금 진하게 */
    var btn = rgb; for (i = 0; i < 12 && ratio(btn, W) < 4.5; i++) btn = step(btn, [0,0,0], .06);
    r.setProperty("--on-primary", "#fff"); r.setProperty("--primary-btn", css(btn));
  }
  var page = dark ? [28,25,23] : [250,247,243], txt = rgb;
  for (i = 0; i < 16 && ratio(txt, page) < 4.5; i++) txt = step(txt, dark ? W : [0,0,0], .07);
  r.setProperty("--primary-text", css(txt));
}

/* ---------- 한국 시간 ---------- */
function kstNow(){
  var f = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul", hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", weekday: "short"
  });
  var o = {}, parts = f.formatToParts(new Date());
  for (var i=0; i<parts.length; i++) o[parts[i].type] = parts[i].value;
  var wmap = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
  var hh = parseInt(o.hour, 10) % 24;
  return {
    ymd: o.year + "-" + o.month + "-" + o.day,
    wd: wmap[o.weekday],
    mins: hh * 60 + parseInt(o.minute, 10)
  };
}
function toMin(t){
  if (!has(t)) return null;
  var m = String(t).match(/^(\d{1,2}):(\d{2})$/);
  return m ? (parseInt(m[1],10) % 24) * 60 + parseInt(m[2],10) : null;
}
function plan(wd){
  var w = (SITE.hours && SITE.hours.week) || {};
  var p = w[DAYS[wd]];
  if (!p || !has(p.open) || !has(p.close)) return null;
  return p;
}
function hasHours(){
  for (var i=0; i<7; i++) if (plan(i)) return true;
  return false;
}
function nextOpenFrom(wd){
  for (var i=1; i<=7; i++){
    var d = (wd + i) % 7, p = plan(d);
    if (p) return { when: (i === 1 ? "내일" : DAYKR[d] + "요일"), time: p.open };
  }
  return null;
}

/* 긴급 공지: 재개 예정일이 지나면 자동 해제 */
function activeNotice(){
  var n = SITE.notice;
  if (!n || !n.on) return null;
  if (has(n.resumeDate)){
    var today = kstNow().ymd;
    if (String(n.resumeDate) < today) return null;
  }
  return n;
}

/* 지금 상태 */
function statusNow(){
  var n = activeNotice();
  if (n){
    var txt = has(n.label) ? n.label : "휴무";
    var extra = [];
    if (has(n.reason)) extra.push(n.reason);
    if (has(n.resumeDate)){
      var d = String(n.resumeDate).split("-");
      if (d.length === 3) extra.push(parseInt(d[1],10) + "월 " + parseInt(d[2],10) + "일부터 다시 엽니다");
    }
    return { cls:"", text: txt, sub: extra.join(" · "), notice:true };
  }
  if (!hasHours()) return null;

  var now = kstNow(), wd = now.wd, mins = now.mins;

  /* 어제 영업이 자정을 넘겨 이어지는 경우 */
  var y = (wd + 6) % 7, py = plan(y);
  if (py){
    var yo = toMin(py.open), yc = toMin(py.close);
    if (yc != null && yo != null && yc <= yo && mins < yc)
      return { cls:"is-open", text:"지금 영업 중", sub: py.close + "까지" };
  }

  var p = plan(wd);
  if (!p){
    var nx = nextOpenFrom(wd);
    return { cls:"", text:"오늘은 정기휴무", sub: nx ? (nx.when + " " + nx.time + " 오픈") : "" };
  }
  var o = toMin(p.open), c0 = toMin(p.close);
  var c = (c0 <= o) ? c0 + 1440 : c0;

  if (mins < o) return { cls:"", text:"영업 준비 중", sub:"오늘 " + p.open + " 오픈" };
  if (mins >= c){
    var nx2 = nextOpenFrom(wd);
    return { cls:"", text:"오늘 영업 종료", sub: nx2 ? (nx2.when + " " + nx2.time + " 오픈") : "" };
  }
  var bs = toMin(p.breakStart), be = toMin(p.breakEnd);
  if (bs != null && be != null && mins >= bs && mins < be)
    return { cls:"is-break", text:"브레이크타임", sub: p.breakEnd + " 다시 엽니다" };

  var sub = p.close + "까지";
  if (SITE.hours && has(SITE.hours.lastOrder)) sub += " · 라스트오더 " + SITE.hours.lastOrder;
  return { cls:"is-open", text:"지금 영업 중", sub: sub };
}

function hoursBlock(){

     ("월 11-21 / 화 11-21 / ..." 다섯 줄 대신 "월–금 11-21" 한 줄) */
  var order = [1,2,3,4,5,6,0];

  order.forEach(function(wd){
    var p = plan(wd);
    var key = p ? [p.open, p.close, p.breakStart || "", p.breakEnd || ""].join("|") : "OFF";
    var last = groups[groups.length - 1];
    if (last && last.key === key) last.days.push(wd);
    else groups.push({ key: key, days: [wd], p: p });
  });

  var h = '<section id="sec-hours" class="reveal"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">Hours</span><h2 class="t-sec">영업시간</h2></div>'

  groups.forEach(function(g){
    var label = g.days.length === 1
      ? DAYKR[g.days[0]]
      : DAYKR[g.days[0]] + "–" + DAYKR[g.days[g.days.length - 1]];
    var isToday = g.days.indexOf(today) !== -1;
    var cls = "hrow" + (isToday ? " today" : "") + (g.p ? "" : " off");

    h += '<div class="' + cls + '"><span class="d">' + label + '</span><span class="v num">';

    else {
      h += esc(g.p.open) + ' – ' + esc(g.p.close);
      if (has(g.p.breakStart) && has(g.p.breakEnd))
        h += '<span class="sub">브레이크타임 ' + esc(g.p.breakStart) + ' – ' + esc(g.p.breakEnd) + '</span>';
    }
    h += '</span></div>';
  });
  h += '</div>';

  var notes = [];
  if (has(hs.lastOrder)) notes.push("라스트오더 " + hs.lastOrder);
  if (has(hs.holidayNote)) notes.push(hs.holidayNote);
  if (notes.length) h += '<p class="hnote">' + esc(notes.join(" · ")) + '</p>';

  h += '</div></section>';
  return h;
}

    + '<' + S + ' charset="UTF-8">new daum.roughmap.Lander({timestamp:"' + esc(m.ts)
    + '",key:"' + esc(m.key) + '",mapWidth:"640",mapHeight:"360"}).render();</' + S + '>'
    + '<' + S + ' charset="UTF-8">setTimeout(function(){'
    + 'var c=document.getElementById("daumRoughmapContainer' + esc(m.ts) + '");'
    + 'if(c&&!c.querySelector("img,canvas,iframe")){document.body.innerHTML='
    + '"<div style=\\"font:14px -apple-system,system-ui,sans-serif;color:#8A7F77;'
    + 'height:100%;display:grid;place-items:center;text-align:center;padding:16px\\">'
    + '\\uc9c0\\ub3c4\\ub97c \\ubd88\\ub7ec\\uc624\\uc9c0 \\ubabb\\ud588\\uc5b4\\uc694.<br>'
    + '\\uc544\\ub798 \\uae38\\ucc3e\\uae30 \\ub2e8\\ucd94\\ub97c \\ub20c\\ub7ec \\uc8fc\\uc138\\uc694.</div>";}'
    + '},4000);</' + S + '>'
    + '</body></html>';
  return '<div class="map-embed"><iframe title="지도" loading="lazy" srcdoc="' + esc(doc) + '"></iframe></div>';
}

/* ---------- 따라다니는 연락 버튼 ---------- */
function fabBlock(){
  var c = SITE.contact || {}, kk = safeUrl(c.kakaoChannel), parts = [];
  if (kk) parts.push('<a class="f-kakao" href="' + esc(kk) + '" target="_blank" rel="noopener"'
    + ' aria-label="카카오톡 채널로 문의">' + I.chat + '</a>');
  if (has(c.phone)) parts.push('<a class="f-call" href="' + esc(telUrl(c.phone)) + '" aria-label="전화 걸기">' + I.phone + '</a>');
  parts.push('<button type="button" class="f-top" id="f-top" aria-label="맨 위로">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>');
  return '<div class="fab">' + parts.join("") + '</div>';
}

function placeBlock(){
  var p = SITE.place || {};
  var info = (p.info || []).filter(function(x){ return x && has(x.label) && has(x.value); });
  if (!has(p.address) && !info.length && !has(p.mapImage) && !hasMap()) return "";

  var h = '<section id="sec-place" class="reveal"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">Location</span><h2 class="t-sec">오시는 길</h2></div>'
        + '<div class="card place-card">';

  if (has(p.address)){
    h += '<div class="addr">'+esc(p.address)+'</div><div class="chips">';
    h += '<button type="button" class="chip" data-copy="'+esc(p.address)+'" data-msg="주소를 복사했어요">'+I.copy+'주소 복사</button>';
    var km = kakaoMapLink();
    if (km) h += '<a class="chip" href="'+esc(km)+'" target="_blank" rel="noopener">'+I.pin+'카카오맵</a>';
    var nm = naverMapLink();
    if (nm) h += '<a class="chip" href="'+esc(nm)+'" target="_blank" rel="noopener">'+I.pin+'네이버 지도</a>';

  }

/* ---------- 단추 글자: 어디로 가는지 드러나게 ---------- */
function bookLabel(u){ return /naver\.(com|me)/i.test(String(u)) ? "네이버로 예약" : "예약하기"; }
function revLabel(u){
  u = String(u);
  if (/naver\.(com|me)/i.test(u)) return "네이버에서 후기 보기";
  if (/kakao\.com/i.test(u)) return "카카오맵에서 후기 보기";
  return "후기 보러 가기";
}

function reviewBlock(){
  var r = (SITE.reviews || []).filter(function(x){ return x && has(x.text); });
  var ru = safeUrl(SITE.reviewUrl);
  if (!r.length && !ru) return "";   /* 후기도, 후기 모음 주소도 없으면 섹션 자체가 나오지 않습니다 */
  var h = '<section id="sec-review" class="reveal band"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">Reviews</span><h2 class="t-sec">손님 후기</h2></div>';
  r.forEach(function(x){
    h += '<div class="rev"><p>'+nl(x.text)+'</p>';
    var meta = [];
    if (has(x.author)) meta.push(x.author);
    if (has(x.date)) meta.push(x.date);
    if (meta.length) h += '<div class="meta">'+esc(meta.join(" · "))+'</div>';
    h += '</div>';
  });
  if (ru){
    if (!r.length) h += '<p class="rev-lead">후기는 저희가 고르지 않았습니다. 손님들이 남긴 그대로 보실 수 있습니다.</p>';
    h += '<a class="btn btn-ghost rev-more" href="' + esc(ru) + '" target="_blank" rel="noopener">' + I.link + revLabel(ru) + '</a>';
  }
  h += '</div></section>';
  return h;
}

/* ---------- 간단히 남기기 ---------- */
function askNumber(){
  var c = SITE.contact || {}, n = String(c.sms || c.phone || "").replace(/[^0-9+]/g, "");
  return /^(\+?82|0)1[016789]/.test(n) ? n : "";      /* 휴대폰 번호일 때만 문자를 보낼 수 있다 */
}
function askForm(){
  var c = SITE.contact || {};
  if (c.form === false) return "";
  var mob = askNumber(), kk = safeUrl(c.kakaoChannel), em = has(c.email), b = "";
  if (!mob && !kk && !em) return "";
  if (mob) b += '<button type="button" class="btn btn-primary" data-ask="sms">' + I.sms + '문자로 보내기</button>';
  if (kk)  b += '<button type="button" class="btn ' + (mob ? "btn-ghost" : "btn-primary") + '" data-ask="kakao">' + I.chat + '카톡으로 보내기</button>';
  if (em && !mob && !kk) b += '<button type="button" class="btn btn-primary" data-ask="mail">' + I.mail + '메일로 보내기</button>';
  return '<div class="ask" role="group" aria-label="간단히 남기기">'
    + '<div class="ask-title">간단히 남기기</div>'
    + '<p class="ask-sub">적으신 내용이 채워진 채로 문자·카톡 창이 열립니다. 이 홈페이지에는 아무것도 저장되지 않습니다.</p>'
    + '<label class="ask-f"><span>이름</span><input type="text" id="ask-name" maxlength="20" autocomplete="name" placeholder="예: 김소담"></label>'
    + '<label class="ask-f"><span>문의 내용</span><textarea id="ask-body" rows="4" maxlength="500" placeholder="예: 토요일 저녁 6시에 4명 자리 있을까요?"></textarea></label>'
    + '<div class="ask-acts">' + b + '</div></div>';
}
function sendAsk(kind){
  var nmEl = document.getElementById("ask-name"), bdEl = document.getElementById("ask-body");
  if (!bdEl) return;
  var nm = (nmEl && nmEl.value || "").trim(), body = (bdEl.value || "").trim();
  if (body.length < 2){ toast("문의 내용을 적어 주세요"); bdEl.focus(); return; }
  var c = SITE.contact || {}, shop = (SITE.shop && SITE.shop.name) || "";
  var text = (shop ? "[" + shop + " 문의]\n" : "") + (nm ? "이름: " + nm + "\n" : "") + body;
  if (SITE.demo){ toast("예시 화면이라 실제로 보내지지는 않습니다"); return; }
  if (kind === "sms"){
    if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
      copy(text, "내용을 복사했어요. " + (c.sms || c.phone) + " 로 문자를 보내 주세요"); return;
    }
    location.href = "sms:" + askNumber() + "?&body=" + encodeURIComponent(text);
  } else if (kind === "kakao"){
    var u = safeUrl(c.kakaoChannel);
    if (!u) return;
    window.open(u.replace(/\/+$/, "") + "/chat", "_blank", "noopener");
    copy(text, "내용을 복사했어요. 카톡 창에 붙여넣어 주세요");
  } else if (kind === "mail" && has(c.email)){
    location.href = "mailto:" + encodeURIComponent(c.email).replace(/%40/g, "@")
      + "?subject=" + encodeURIComponent((shop ? "[" + shop + "] " : "") + "문의") + "&body=" + encodeURIComponent(text);
  }
}

function contactBlock(){
  var c = SITE.contact || {}, btns = [], callCard = "";
  var bk0 = safeUrl(c.booking);
  if (bk0)
    btns.push('<a class="btn btn-primary" href="'+esc(bk0)+'" target="_blank" rel="noopener">'+I.cal+bookLabel(bk0)+'</a>');
  if (has(c.phone) && !bk0)
    callCard = '<a class="call-card" href="'+esc(telUrl(c.phone))+'" aria-label="전화 걸기 '+esc(c.phone)+'">'
      + '<span class="cc-l">전화 문의</span><span class="cc-n">'+esc(c.phone)+'</span>'
      + '<span class="btn btn-primary">'+I.phone+'지금 전화하기</span></a>';
  else if (has(c.phone))
    btns.push('<a class="btn btn-ghost" href="'+esc(telUrl(c.phone))+'">'+I.phone+esc(c.phone)+'</a>');
  if (has(c.sms))
    btns.push('<a class="btn btn-ghost" href="sms:'+esc(String(c.sms).replace(/[^0-9+]/g,""))+'">'+I.sms+'문자 보내기</a>');
  var kk = safeUrl(c.kakaoChannel);
  if (kk)
    btns.push('<a class="btn btn-ghost" href="'+esc(kk.replace(/\/+$/,"") + "/chat")+'" target="_blank" rel="noopener">'+I.chat+'카톡으로 문의</a>');
  if (has(c.email))
    btns.push('<a class="btn btn-ghost" href="mailto:'+esc(c.email)+'">'+I.mail+esc(c.email)+'</a>');

  (SITE.links || []).forEach(function(l){
    var u = safeUrl(l && l.url);
    if (u && has(l.label))
      btns.push('<a class="btn btn-ghost" href="'+esc(u)+'" target="_blank" rel="noopener">'+I.link+esc(l.label)+'</a>');
  });

  if (!btns.length && !callCard) return "";

  var h = '<section id="sec-contact" class="reveal"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">Contact</span><h2 class="t-sec">문의하기</h2></div>'
        + callCard
        + (btns.length ? '<div class="contact-grid">'+btns.join("")+'</div>' : "")
        + askForm()
        + '<div class="share">'
        + '<button type="button" class="btn btn-ghost btn-sm" id="btn-share">'+I.share+'공유하기</button>'
        + '<button type="button" class="btn btn-ghost btn-sm" id="btn-copylink">'+I.copy+'링크 복사</button>'
        + '</div></div></section>';
  return h;
}

function footerBlock(){
  var s = SITE.shop || {}, L = SITE.legal || {}, c = SITE.contact || {}, p = SITE.place || {};
  var h = '<footer><div class="wrap">';
  h += '<div class="f-name">'+esc(s.name || "")+'</div>';
  var meta = [];
  if (has(p.address)) meta.push(esc(p.address));
  if (has(c.phone)) meta.push(esc(c.phone));
  if (has(L.bizName)) meta.push(esc(L.bizName));
  if (has(L.bizNumber)) meta.push("사업자등록번호 " + esc(L.bizNumber));
  var pu = safeUrl(L.privacyUrl);
  if (pu) meta.push('<a href="'+esc(pu)+'" target="_blank" rel="noopener">개인정보처리방침</a>');
  if (meta.length) h += '<div class="f-meta">'+meta.join("<br>")+'</div>';
  if (L.credit !== false) h += '<div class="credit">내 가게 홈페이지로 만들었습니다</div>';
  h += '</div>';
  if (has(s.name)) h += '<div class="f-ghost" aria-hidden="true">'+esc(s.name)+'</div>';
  h += '</footer>';
  return h;
}

function stickyBlock(){
  var c = SITE.contact || {}, km = kakaoMapLink(), bk = safeUrl(c.booking);
  var parts = [];
  if (bk) parts.push('<a class="btn btn-primary lead" href="'+esc(bk)+'" target="_blank" rel="noopener">'+I.cal+bookLabel(bk)+'</a>');
  else if (km) parts.push('<a class="btn btn-primary lead" href="'+esc(km)+'" target="_blank" rel="noopener">'+I.pin+'길찾기</a>');
  if (has(c.phone)) parts.push('<a class="btn btn-ghost" href="'+esc(telUrl(c.phone))+'">'+I.phone+'전화</a>');
  else if (bk && km) parts.push('<a class="btn btn-ghost" href="'+esc(km)+'" target="_blank" rel="noopener">'+I.pin+'길찾기</a>');
  if (!parts.length) return "";
  var kk = safeUrl(c.kakaoChannel);
  if (kk) parts.push('<a class="btn k" href="'+esc(kk)+'" target="_blank" rel="noopener" aria-label="카카오톡 채널로 문의">'+I.chat+'</a>');
  return '<div class="sticky" id="sticky">'+parts.join("")+'</div>';
}

/* 위쪽 차례 막대 — 있는 칸만 모아서 만든다 */
function topnavBlock(){
  var map = [["sec-menu","메뉴"],["sec-photo","사진"],["sec-owner","소개"],
             ["sec-hours","영업시간"],["sec-place","오시는 길"],["sec-contact","문의"]];
  var links = [];
  map.forEach(function(m){
    if (document.getElementById(m[0])) links.push('<a href="#'+m[0]+'">'+m[1]+'</a>');
  });
  if (links.length < 3) return "";
  return '<nav class="topnav" id="topnav"><div class="nav-in">'+links.join("")+'</div></nav>';
}

/* ---------- 그리기 ---------- */
function render(){
  applyTheme();
  var html = "";
  if (SITE.demo){
    html += '<div class="demo-ribbon"><b>틀 미리보기</b> · 내용은 모양을 보려고 넣은 예시입니다. 빌더에서 받는 파일에는 이 줄이 없습니다.</div>';
  }
  [heroBlock, quoteBlock, menuBlock, bandBlock, galleryBlock, ownerBlock, hoursBlock, placeBlock, reviewBlock, contactBlock, footerBlock].forEach(function(fn){
    try { html += fn(); } catch (e) { if (window.console) console.warn("칸 하나를 건너뜀:", e); }
  });

  document.getElementById("app").innerHTML = html;
  document.body.insertAdjacentHTML("beforeend", stickyBlock());
  document.body.insertAdjacentHTML("beforeend", fabBlock());
  /* f-top-click */
  var topBtn = document.getElementById("f-top");
  if (topBtn) topBtn.addEventListener("click", function(){
    var rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top:0, behavior: rm ? "auto" : "smooth" });
  });
  document.body.insertAdjacentHTML("afterbegin", topnavBlock());

  /* 보이는 칸이 적으면 간격을 좁힌다 */
  var secCount = document.querySelectorAll("#app section").length;
  document.body.classList.toggle("lean", secCount <= 5);

  if (!document.title && has(SITE.shop && SITE.shop.name)) document.title = SITE.shop.name;

  /* 칸 번호 */
  var heads = document.querySelectorAll("#app section .sec-head");
  if (heads.length >= 3) for (var hi = 0; hi < heads.length; hi++){
    heads[hi].insertAdjacentHTML("afterbegin", '<span class="sec-no" aria-hidden="true">' + ("0" + (hi + 1)).slice(-2) + '</span>');
  }
  /* 사진 넘길 때 아래 점 옮기기 */
  var reel = document.getElementById("reel"), dots = document.getElementById("reel-dots");
  if (reel && dots){
    var rt = 0;
    reel.addEventListener("scroll", function(){
      if (rt) return;
      rt = setTimeout(function(){
        rt = 0;
        var figs = reel.children, mid = reel.scrollLeft + reel.clientWidth / 2, best = 0, bd = 1e9;
        for (var i = 0; i < figs.length; i++){
          var d = Math.abs(figs[i].offsetLeft + figs[i].offsetWidth / 2 - mid);
          if (d < bd){ bd = d; best = i; }
        }
        for (var j = 0; j < dots.children.length; j++) dots.children[j].className = j === best ? "on" : "";
      }, 80);
    }, { passive:true });
  }

  bind();
  revealOn();
  stickyOn();
}

function bind(){
  document.addEventListener("click", function(e){
    var ask = e.target.closest("[data-ask]");
    if (ask){ sendAsk(ask.getAttribute("data-ask")); return; }

    var t = e.target.closest("[data-copy]");
    if (t){ copy(t.getAttribute("data-copy"), t.getAttribute("data-msg")); return; }

    if (e.target.closest("#btn-copylink")){ copy(location.href, "링크를 복사했어요"); return; }

    if (e.target.closest("#btn-share")){
      var name = (SITE.shop && SITE.shop.name) || document.title;
      if (navigator.share){
        navigator.share({ title: name, url: location.href }).catch(function(){});
      } else {
        copy(location.href, "링크를 복사했어요");
      }
    }
  });
}

function revealOn(){
  var els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)){
    for (var i=0; i<els.length; i++) els[i].classList.add("in");
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
    });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
  for (var j=0; j<els.length; j++) io.observe(els[j]);
}

function stickyOn(){
  var el = document.getElementById("sticky");
  var nav = document.getElementById("topnav");
  var hero = document.querySelector("header.hero");
  var trigger = hero ? Math.max(260, hero.offsetHeight - 70) : 320;
  var onScroll = function(){
    var y = window.scrollY;
    if (el) el.classList.toggle("show", y > 320);
    var ft = document.getElementById("f-top");
    if (ft) ft.classList.toggle("on", y > 700);
    if (nav) nav.classList.toggle("show", y > trigger);
  };
  window.addEventListener("scroll", onScroll, { passive:true });
  onScroll();
}

/* 상태 표시를 1분마다 새로 계산 */
function tick(){
  setInterval(function(){
    var st = statusNow(), box = document.querySelector(".status");
    if (!st || !box) return;
    box.className = "status " + st.cls;
    box.innerHTML = '<span class="dot"></span><span>' + esc(st.text)
      + (has(st.sub) ? ' <span style="font-weight:500;opacity:.85">· '+esc(st.sub)+'</span>' : '') + '</span>';
  }, 60000);
}

render();
tick();

/* 밝은↔어두운 화면이 바뀌면 색을 다시 계산 */
if (window.matchMedia){
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var onScheme = function(){ applyTheme(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}
})();
</script>
