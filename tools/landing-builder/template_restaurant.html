<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="소담식당 · 광주 동구">
<meta property="og:description" content="광주 동구 작은 한식당. 매일 아침 끓이는 국과 제철 반찬.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap">

<style>
/* ============================================================
   디자인 토큰
   ============================================================ */
:root{
  --primary:#C0452C;          /* 업종 색 방향: 음식 색에서 가져온 따뜻한 1색 */
  --primary-deep:#9A3620;
  --primary-soft:#FBEDE8;
  --primary-shadow:rgba(192,69,44,.25);
  --ink:#1B1714;
  --ink-2:#4A423C;
  --ink-3:#8A7F77;
  --line:#E8E0D8;
  --bg:#FAF7F3;
  --card:#FFFFFF;
  --ok:#1F7A4D;
  --ok-soft:#E8F5EE;
  --warn:#9A5B10;
  --warn-soft:#FDF2DF;
  --off:#6B625C;
  --off-soft:#F0ECE7;
  --radius:18px;
  --radius-sm:12px;
  --shadow-s:0 1px 2px rgba(27,23,20,.05), 0 2px 8px rgba(27,23,20,.04);
  --shadow-m:0 2px 6px rgba(27,23,20,.06), 0 12px 32px rgba(27,23,20,.07);
  --maxw:720px;
  --pad:22px;
  /* 제목 글꼴. 점주가 '명조'를 고르면 자바스크립트가 명조로 바꾼다 */
  --font-title:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  --sec-gap:72px;
}
@media (min-width:768px){ :root{ --sec-gap:92px; --pad:32px; } }

/* 섹션이 적을 때는 간격을 줄인다 (내용이 적을수록 구멍처럼 보이므로) */
body.lean{ --sec-gap:48px; }
@media (min-width:768px){ body.lean{ --sec-gap:64px; } }

/* 어두운 화면 */
@media (prefers-color-scheme:dark){
  :root{
    --ink:#F3EEE9; --ink-2:#BCB3AB; --ink-3:#8A8079;
    --line:#332D29; --bg:#141110; --card:#1C1917;
    --ok:#4FBF88; --ok-soft:#15291F;
    --warn:#D9A24E; --warn-soft:#2A2013;
    --off:#99908A; --off-soft:#231F1C;
    --shadow-s:0 1px 2px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.22);
    --shadow-m:0 2px 6px rgba(0,0,0,.38), 0 12px 32px rgba(0,0,0,.3);
  }
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.7; letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
  /* 한국어는 이게 없으면 단어 중간에서 줄이 끊긴다 ("올립/니다") */
  word-break:keep-all; overflow-wrap:break-word;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
@media (min-width:768px){ body{ padding-bottom:0; } }
img{ max-width:100%; display:block; }
a{ color:inherit; }
button{ font:inherit; color:inherit; }

/* ============================================================
   타이포 위계 (4단계)
   ============================================================ */
body[data-title-font="serif"]{
  --font-title:"Noto Serif KR","Pretendard Variable",Pretendard,serif;
}
.t-hero{ font-family:var(--font-title); font-size:clamp(32px,8.4vw,52px); line-height:1.18; letter-spacing:-.035em; font-weight:800; margin:0; }
.t-sec{ font-family:var(--font-title); font-size:clamp(21px,5vw,27px); line-height:1.3; letter-spacing:-.028em; font-weight:750; margin:0; }
/* 명조는 획이 가늘어 같은 굵기로도 더 가벼워 보인다. 한 단계 올린다 */
body[data-title-font="serif"] .t-hero{ font-weight:700; letter-spacing:-.03em; }
body[data-title-font="serif"] .t-sec{ font-weight:600; letter-spacing:-.022em; }
.t-body{ font-size:16px; line-height:1.75; color:var(--ink-2); }
.t-cap{ font-size:13px; line-height:1.6; color:var(--ink-3); letter-spacing:-.005em; }
.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 var(--pad); }

/* ============================================================
   섹션 공통 + 페이드인
   ============================================================ */
section{ margin-top:var(--sec-gap); scroll-margin-top:66px; }

/* 색이 다른 띠 — 같은 배경이 끝까지 이어지면 밋밋해 보인다 */
section.band{
  padding:calc(var(--sec-gap) * .68) 0;
  background:var(--card);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
}
.sec-head{ margin-bottom:18px; }
.sec-head .eyebrow{
  display:block; font-size:12px; font-weight:700; letter-spacing:.14em;
  color:var(--primary); text-transform:uppercase; margin-bottom:9px;
}
.reveal{ opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1); }
.reveal.in{ opacity:1; transform:none; }
@media (prefers-reduced-motion:reduce){ .reveal{ opacity:1; transform:none; transition:none; } html{ scroll-behavior:auto; } }

/* ============================================================
   미리보기 리본 (빌더에서 받은 파일에는 나오지 않음)
   ============================================================ */
.demo-ribbon{
  background:#2B2420; color:#F6EFE8; text-align:center;
  font-size:12.5px; padding:9px 16px; letter-spacing:-.01em;
}
.demo-ribbon b{ color:#FFD9A0; font-weight:700; }

/* ============================================================
   히어로
   ============================================================ */
.hero{ position:relative; margin-top:0; overflow:hidden; }
.hero.has-photo{ padding-top:0; }
.hero.has-photo::before{
  content:""; position:absolute; inset:0 0 auto; height:420px;
  background:
    radial-gradient(120% 90% at 88% 0%, var(--primary-soft) 0%, transparent 62%),
    linear-gradient(180deg, var(--card) 0%, var(--bg) 100%);
  z-index:-1;
}
/* 사진이 없을 때: 빈 사진칸을 두지 않고, 색 있는 패널과 큰 글자로 첫 화면을 세운다 */
.hero.no-photo .hero-panel{
  background:linear-gradient(168deg, var(--primary-soft) 0%, var(--bg) 94%);
  border-bottom:1px solid var(--line);
  padding:40px 0 40px;
}
.hero.no-photo .t-hero{ font-size:clamp(38px,11.2vw,62px); letter-spacing:-.04em; }
.hero.no-photo .tagline{ font-size:clamp(16.5px,4.4vw,19.5px); max-width:26ch; }
.hero.no-photo .hero-actions{ margin-top:22px; }
.hero-logo{ width:54px; height:54px; border-radius:14px; object-fit:cover; box-shadow:var(--shadow-s); margin-bottom:12px; }
.status{
  display:inline-flex; align-items:center; gap:8px;
  padding:7px 14px 7px 12px; border-radius:999px;
  font-size:13.5px; font-weight:650; letter-spacing:-.015em;
  background:var(--off-soft); color:var(--off); margin-bottom:12px;
}
.status .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }
.status.is-open{ background:var(--ok-soft); color:var(--ok); }
.status.is-open .dot{ box-shadow:0 0 0 0 rgba(31,122,77,.5); animation:pulse 2.4s infinite; }
.status.is-break{ background:var(--warn-soft); color:var(--warn); }
@keyframes pulse{ 70%{ box-shadow:0 0 0 7px rgba(31,122,77,0); } 100%{ box-shadow:0 0 0 0 rgba(31,122,77,0); } }

.hero h1{ margin:0; }
.hero .tagline{ margin:10px 0 0; font-size:clamp(15.5px,4.1vw,18px); color:var(--ink-2); line-height:1.65; max-width:30ch; }
/* 버튼이 하나뿐이면 가로로 꽉 채운다. 반만 차 있으면 허전해 보인다 */
.hero-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
.hero-actions .btn:only-child{ flex:1 1 100%; }

/* 사진이 있으면 첫 화면을 사진이 통째로 채우고, 그 위에 상호와 영업 상태를 얹는다 */
.hero-cover{ position:relative; height:clamp(300px, 52vh, 440px); overflow:hidden; background:var(--primary-soft); }
.hero-cover > img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.hero-veil{
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.76) 0%, rgba(0,0,0,.44) 40%, rgba(0,0,0,.06) 100%);
}
.hero-over{ position:absolute; left:0; right:0; bottom:0; padding-bottom:20px; }
.hero-over .t-hero{ color:#fff; text-shadow:0 1px 16px rgba(0,0,0,.4); }
.hero-over .tagline{ color:rgba(255,255,255,.92); margin-top:8px; text-shadow:0 1px 10px rgba(0,0,0,.4); }
.hero-over .status{ margin-bottom:10px; box-shadow:0 2px 10px rgba(0,0,0,.22); }
.hero-logo.on-photo{ width:48px; height:48px; border-radius:13px; margin-bottom:10px; box-shadow:0 3px 12px rgba(0,0,0,.35); }
.hero-below{ padding-top:18px; }
.hero-below .hero-actions{ margin-top:0; }

/* 긴급 공지 */
.notice{
  margin-top:26px; background:var(--primary-soft); border:1px solid var(--line);
  border-left:4px solid var(--primary); border-radius:var(--radius-sm);
  padding:16px 18px;
}
.notice .nt{ font-weight:700; font-size:15px; color:var(--primary-deep); letter-spacing:-.02em; }
.notice .nb{ margin-top:5px; font-size:14.5px; color:var(--ink-2); line-height:1.6; }

/* ============================================================
   버튼
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:0 20px; border-radius:13px;
  font-size:15.5px; font-weight:680; letter-spacing:-.018em;
  text-decoration:none; border:1px solid transparent; cursor:pointer;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{ transform:scale(.975); }
.btn-primary{ background:var(--primary); color:#fff; box-shadow:0 2px 10px var(--primary-shadow); }
.btn-primary:hover{ background:var(--primary-deep); }
.btn-ghost{ background:var(--card); color:var(--ink); border-color:var(--line); box-shadow:var(--shadow-s); }
.btn-ghost:hover{ border-color:#D6CCC2; }
.btn-sm{ min-height:40px; padding:0 14px; font-size:13.5px; border-radius:11px; }
.btn svg{ width:17px; height:17px; flex:none; }

/* 위쪽 차례 막대 — 스크롤하면 나타난다 */
.topnav{
  position:fixed; top:0; left:0; right:0; z-index:35;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line);
  transform:translateY(-101%); transition:transform .28s cubic-bezier(.2,.8,.3,1);
}
.topnav.show{ transform:none; }
.topnav .nav-in{
  max-width:var(--maxw); margin:0 auto; padding:13px var(--pad);
  display:flex; gap:20px; overflow-x:auto; scrollbar-width:none;
}
.topnav .nav-in::-webkit-scrollbar{ display:none; }
.topnav a{
  font-size:14px; font-weight:650; letter-spacing:-.02em;
  color:var(--ink-2); text-decoration:none; white-space:nowrap;
}
.topnav a:hover{ color:var(--primary); }

/* ============================================================
   메뉴 / 가격표
   ============================================================ */
/* 대표 메뉴에 사진이 있으면 큰 카드로 먼저 보여준다 */
.m-cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
@media (max-width:430px){ .m-cards{ grid-template-columns:1fr; } }
.m-card{
  border-radius:var(--radius); overflow:hidden; background:var(--card);
  border:1px solid var(--line); box-shadow:var(--shadow-s);
}
.m-card img{ width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--primary-soft); display:block; }
.m-card .c-body{ padding:13px 15px 15px; }
.m-card .c-name{ font-size:16.5px; font-weight:700; letter-spacing:-.024em; }
.m-card .c-price{ margin-top:5px; font-size:17px; font-weight:750; color:var(--primary); letter-spacing:-.02em; }
.m-card .c-note{ margin-top:6px; font-size:13px; color:var(--ink-3); line-height:1.55; }

/* 가게 한마디 — 사진이 없어도 한 화면을 채우는 장치 */
.quote{ text-align:center; }
.quote .mark{
  font-family:Georgia,"Times New Roman",serif; font-size:46px; line-height:.9;
  color:var(--primary); opacity:.32; display:block; margin-bottom:2px;
}
.quote .q{
  font-family:var(--font-title); font-weight:600;
  font-size:clamp(20px,5.4vw,28px); line-height:1.6; letter-spacing:-.028em;
  color:var(--ink); margin:0 auto; max-width:24ch;
  word-break:keep-all;
}
.quote .by{ margin-top:16px; font-size:13.5px; color:var(--ink-3); letter-spacing:-.01em; }

.menu-list{ display:flex; flex-direction:column; gap:0; }
.m-item{
  display:flex; gap:14px; align-items:flex-start;
  padding:17px 0; border-bottom:1px solid var(--line);
}
.m-item:first-child{ border-top:1px solid var(--line); }
.m-item.is-signature{ background:linear-gradient(90deg, var(--primary-soft), transparent 72%); }
.m-thumb{ width:76px; height:76px; border-radius:var(--radius-sm); object-fit:cover; flex:none; background:var(--primary-soft); }
.m-main{ flex:1 1 auto; min-width:0; }
.m-top{ display:flex; align-items:baseline; gap:10px; }
.m-name{ font-size:16.5px; font-weight:680; letter-spacing:-.022em; flex:1 1 auto; }
.m-price{ font-size:16.5px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; }
.m-note{ margin-top:4px; font-size:13.5px; color:var(--ink-3); line-height:1.55; }
.badge{
  display:inline-block; vertical-align:2px; margin-right:6px;
  font-size:11px; font-weight:750; letter-spacing:.02em;
  color:#fff; background:var(--primary); padding:2.5px 7px; border-radius:6px;
}
.price-note{ margin-top:16px; font-size:12.5px; color:var(--ink-3); }

.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; }
.chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:8px 14px; font-size:13.5px; font-weight:600; color:var(--ink-2);
  box-shadow:var(--shadow-s); text-decoration:none; white-space:nowrap;
  transition:transform .12s ease;
}
.chip:active{ transform:scale(.97); }

/* 원산지 */
.origin{ margin-top:24px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--card); overflow:hidden; }
.origin summary{
  cursor:pointer; padding:14px 18px; font-size:14px; font-weight:650;
  list-style:none; display:flex; justify-content:space-between; align-items:center;
}
.origin summary::-webkit-details-marker{ display:none; }
.origin summary::after{ content:"＋"; color:var(--ink-3); font-weight:400; }
.origin[open] summary::after{ content:"－"; }
.origin-body{ padding:0 18px 16px; }
.origin-row{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px dashed var(--line); font-size:14px; }
.origin-row span:last-child{ color:var(--ink-2); }

/* ============================================================
   갤러리
   ============================================================ */
.gal{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.gal img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:var(--radius-sm); background:var(--primary-soft); }
.gal.scroll{
  display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  padding:0 var(--pad) 6px; margin:0 calc(var(--pad) * -1);
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.gal.scroll::-webkit-scrollbar{ display:none; }
.gal.scroll img{ width:72%; max-width:300px; aspect-ratio:4/3; flex:none; scroll-snap-align:center; }

/* ============================================================
   사장님 소개 (책 페이지의 '저자 소개'에 해당)
   ============================================================ */
.owner{ display:flex; gap:18px; align-items:flex-start; }
.owner img{
  width:88px; height:88px; flex:none; border-radius:50%;
  object-fit:cover; box-shadow:var(--shadow-s); background:var(--primary-soft);
}
.owner .o-body{ flex:1 1 auto; min-width:0; }
.owner .o-name{ font-family:var(--font-title); font-size:19px; font-weight:700; letter-spacing:-.025em; }
.owner .o-role{ margin-top:3px; font-size:13px; color:var(--primary); font-weight:650; }
.owner .o-text{ margin-top:11px; font-size:15.5px; line-height:1.75; color:var(--ink-2); }
@media (max-width:420px){
  .owner{ gap:14px; }
  .owner img{ width:70px; height:70px; }
}

/* ============================================================
   영업시간
   ============================================================ */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-s); padding:6px 20px; }
.hrow{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); font-size:15px; }
.hrow:last-child{ border-bottom:none; }
.hrow .d{ font-weight:650; min-width:3.2em; flex:none; white-space:nowrap; }
.hrow .v{ color:var(--ink-2); text-align:right; }
.hrow .v .sub{ display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px; }
.hrow.today{ color:var(--primary-deep); }
.hrow.today .d::after{ content:" 오늘"; font-size:11px; font-weight:700; letter-spacing:-.01em; }
.hrow.today .v{ color:var(--primary-deep); font-weight:650; }
.hrow.off .v{ color:var(--ink-3); }
.hnote{ margin-top:14px; font-size:13.5px; color:var(--ink-3); line-height:1.6; }

/* ============================================================
   오시는 길
   ============================================================ */
.place-card{ padding:20px; }
.addr{ font-size:17px; font-weight:650; letter-spacing:-.022em; line-height:1.55; }
.place-card .chips{ margin-top:14px; }
.map-img{ margin-top:18px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--line); }
.info-list{ margin:18px 0 0; padding:0; list-style:none; }
.info-list li{ display:flex; gap:11px; padding:9px 0; font-size:14.5px; color:var(--ink-2); border-top:1px solid var(--line); }
.info-list li span{ min-width:0; overflow-wrap:anywhere; }
.info-list li b{ color:var(--ink); font-weight:650; flex:none; min-width:4.6em; }

/* ============================================================
   후기
   ============================================================ */
.rev{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow-s); margin-bottom:12px; }
.rev p{ margin:0; font-size:15.5px; line-height:1.7; color:var(--ink-2); }
.rev .meta{ margin-top:12px; font-size:12.5px; color:var(--ink-3); }

/* ============================================================
   문의 · 공유
   ============================================================ */
.contact-grid{ display:grid; gap:10px; }
@media (min-width:520px){ .contact-grid{ grid-template-columns:1fr 1fr; } }
.contact-grid .btn{ width:100%; }
.share{ display:flex; gap:9px; flex-wrap:wrap; margin-top:20px; }

/* ============================================================
   푸터
   ============================================================ */
footer{ margin-top:var(--sec-gap); padding:26px 0 22px; border-top:1px solid var(--line); }
footer .f-name{ font-size:15px; font-weight:700; letter-spacing:-.02em; }
footer .f-meta{ margin-top:8px; font-size:12.5px; color:var(--ink-3); line-height:1.75; }
footer .f-meta a{ color:var(--ink-3); text-decoration:underline; text-underline-offset:2px; }
footer .credit{ margin-top:16px; font-size:11.5px; color:#B5ABA3; }

/* ============================================================
   하단 스티키 CTA
   ============================================================ */
.sticky{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px) saturate(1.2);
  border-top:1px solid var(--line);
  display:flex; gap:9px; max-width:var(--maxw); margin:0 auto;
  transform:translateY(110%); transition:transform .32s cubic-bezier(.2,.8,.3,1);
}
.sticky.show{ transform:none; }
.sticky .btn{ flex:1 1 0; min-width:0; }
.sticky .btn.lead{ flex:1.5 1 0; }
@media (min-width:768px){ .sticky{ display:none; } }

/* 토스트 */
.toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); z-index:60;
  transform:translate(-50%,14px); opacity:0; pointer-events:none;
  background:#241E1A; color:#fff; font-size:13.5px; font-weight:600;
  padding:11px 18px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.2);
  transition:opacity .22s ease, transform .22s ease;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }
@media (min-width:768px){ .toast{ bottom:34px; } }

.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

<script>
(function(){
"use strict";

/* ---------- 데이터 읽기 ---------- */
var SITE = {};
try { SITE = JSON.parse(document.getElementById("site-data").textContent) || {}; }
catch(e){ SITE = {}; }

var DAYS  = ["sun","mon","tue","wed","thu","fri","sat"];
var DAYKR = ["일","월","화","수","목","금","토"];

/* ---------- 유틸 ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function nl(s){ return esc(s).replace(/\n/g,"<br>"); }
function has(v){
  if (v == null) return false;
  if (typeof v === "string") return v.trim() !== "";
  if (Array.isArray(v)) return v.length > 0;
  return true;
}
/* 외부 링크는 http/https 만 허용 */
function safeUrl(u){
  if (!has(u)) return "";
  var s = String(u).trim();
  return /^https?:\/\//i.test(s) ? s : "";
}
function telUrl(p){ return "tel:" + String(p).replace(/[^0-9+]/g,""); }

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tid);
  t._tid = setTimeout(function(){ t.classList.remove("show"); }, 1900);
}
function copy(text, msg){
  var done = function(){ toast(msg || "복사했어요"); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ legacy(); });
  } else { legacy(); }
  function legacy(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){ toast("복사하지 못했어요"); }
    document.body.removeChild(ta);
  }
}

/* 사진이 없을 때 쓰는 플레이스홀더 (가짜 음식 사진을 만들지 않습니다) */
function ph(kind){
  var p = (SITE.theme && SITE.theme.primary) || "#C0452C";
  var sq = (kind === "logo");
  var w = sq ? 120 : 400, h = sq ? 120 : 300;
  var sc = sq ? 0.62 : 1;
  var glyph = '<g transform="translate(' + (w/2) + ',' + (h/2) + ') scale(' + sc + ')" '
    + 'fill="none" stroke="' + p + '" stroke-opacity=".32" stroke-width="3" stroke-linecap="round">'
    + '<circle cx="0" cy="0" r="20"/><path d="M0 -31V31M-14 -24v11M14 -24v11"/></g>';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '">'
    + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="' + p + '" stop-opacity=".12"/>'
    + '<stop offset="1" stop-color="' + p + '" stop-opacity=".035"/></linearGradient></defs>'
    + '<rect width="' + w + '" height="' + h + '" fill="url(#g)"/>' + glyph + '</svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* 고른 색에서 진한 색·연한 색·그림자 색을 만들어 냅니다 */
function hex2rgb(h){
  var m = String(h || "").trim().replace("#", "");
  if (m.length === 3) m = m[0]+m[0]+m[1]+m[1]+m[2]+m[2];
  if (!/^[0-9a-f]{6}$/i.test(m)) return null;
  return [parseInt(m.slice(0,2),16), parseInt(m.slice(2,4),16), parseInt(m.slice(4,6),16)];
}
function mix(rgb, to, t){
  return "#" + rgb.map(function(v, i){
    var x = Math.round(v + (to[i] - v) * t);
    return ("0" + Math.max(0, Math.min(255, x)).toString(16)).slice(-2);
  }).join("");
}
function isDark(){
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function applyTheme(){
  var tf = (SITE.theme && SITE.theme.titleFont) || "serif";
  document.body.setAttribute("data-title-font", tf === "sans" ? "sans" : "serif");

  var hex = (SITE.theme && SITE.theme.primary) || "";
  var rgb = hex2rgb(hex);
  if (!rgb) return;
  var r = document.documentElement.style, dark = isDark();
  r.setProperty("--primary", hex);
  /* 어두운 화면에서는 진한 색을 오히려 밝게, 연한 색을 어둡게 만들어야 읽힙니다 */
  r.setProperty("--primary-deep", dark ? mix(rgb, [255,255,255], 0.34) : mix(rgb, [0,0,0], 0.24));
  r.setProperty("--primary-soft", dark ? mix(rgb, [20,17,16], 0.84)    : mix(rgb, [255,255,255], 0.90));
  r.setProperty("--primary-shadow", "rgba(" + rgb.join(",") + (dark ? ",.34)" : ",.25)"));
}

/* ---------- 한국 시간 ---------- */
function kstNow(){
  var f = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Seoul", hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", weekday: "short"
  });
  var o = {}, parts = f.formatToParts(new Date());
  for (var i=0; i<parts.length; i++) o[parts[i].type] = parts[i].value;
  var wmap = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
  var hh = parseInt(o.hour, 10) % 24;
  return {
    ymd: o.year + "-" + o.month + "-" + o.day,
    wd: wmap[o.weekday],
    mins: hh * 60 + parseInt(o.minute, 10)
  };
}
function toMin(t){
  if (!has(t)) return null;
  var m = String(t).match(/^(\d{1,2}):(\d{2})$/);
  return m ? (parseInt(m[1],10) % 24) * 60 + parseInt(m[2],10) : null;
}
function plan(wd){
  var w = (SITE.hours && SITE.hours.week) || {};
  var p = w[DAYS[wd]];
  if (!p || !has(p.open) || !has(p.close)) return null;
  return p;
}
function hasHours(){
  for (var i=0; i<7; i++) if (plan(i)) return true;
  return false;
}
function nextOpenFrom(wd){
  for (var i=1; i<=7; i++){
    var d = (wd + i) % 7, p = plan(d);
    if (p) return { when: (i === 1 ? "내일" : DAYKR[d] + "요일"), time: p.open };
  }
  return null;
}

/* 긴급 공지: 재개 예정일이 지나면 자동 해제 */
function activeNotice(){
  var n = SITE.notice;
  if (!n || !n.on) return null;
  if (has(n.resumeDate)){
    var today = kstNow().ymd;
    if (String(n.resumeDate) < today) return null;
  }
  return n;
}

/* 지금 상태 */
function statusNow(){
  var n = activeNotice();
  if (n){
    var txt = has(n.label) ? n.label : "휴무";
    var extra = [];
    if (has(n.reason)) extra.push(n.reason);
    if (has(n.resumeDate)){
      var d = String(n.resumeDate).split("-");
      if (d.length === 3) extra.push(parseInt(d[1],10) + "월 " + parseInt(d[2],10) + "일부터 다시 엽니다");
    }
    return { cls:"", text: txt, sub: extra.join(" · "), notice:true };
  }
  if (!hasHours()) return null;

  var now = kstNow(), wd = now.wd, mins = now.mins;

  /* 어제 영업이 자정을 넘겨 이어지는 경우 */
  var y = (wd + 6) % 7, py = plan(y);
  if (py){
    var yo = toMin(py.open), yc = toMin(py.close);
    if (yc != null && yo != null && yc <= yo && mins < yc)
      return { cls:"is-open", text:"지금 영업 중", sub: py.close + "까지" };
  }

  var p = plan(wd);
  if (!p){
    var nx = nextOpenFrom(wd);
    return { cls:"", text:"오늘은 정기휴무", sub: nx ? (nx.when + " " + nx.time + " 오픈") : "" };
  }
  var o = toMin(p.open), c0 = toMin(p.close);
  var c = (c0 <= o) ? c0 + 1440 : c0;

  if (mins < o) return { cls:"", text:"영업 준비 중", sub:"오늘 " + p.open + " 오픈" };
  if (mins >= c){
    var nx2 = nextOpenFrom(wd);
    return { cls:"", text:"오늘 영업 종료", sub: nx2 ? (nx2.when + " " + nx2.time + " 오픈") : "" };
  }
  var bs = toMin(p.breakStart), be = toMin(p.breakEnd);
  if (bs != null && be != null && mins >= bs && mins < be)
    return { cls:"is-break", text:"브레이크타임", sub: p.breakEnd + " 다시 엽니다" };

  var sub = p.close + "까지";
  if (SITE.hours && has(SITE.hours.lastOrder)) sub += " · 라스트오더 " + SITE.hours.lastOrder;
  return { cls:"is-open", text:"지금 영업 중", sub: sub };
}

/* ---------- 아이콘 ---------- */
var I = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2Z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.9 9.9 0 0 1-3.2-.5L3 21l1.6-4.3A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>',
  sms:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>'
};

/* ---------- 지도 링크 ---------- */
function kakaoMapLink(){
  var p = SITE.place || {};
  var u = safeUrl(p.kakaoMapUrl);
  if (u) return u;
  if (has(p.address)) return "https://map.kakao.com/link/search/" + encodeURIComponent(p.address);
  return "";
}
/* 한국 가게 검색은 네이버 지도를 더 많이 쓴다. 붙여넣은 링크가 없으면 주소로 검색시킨다 */
function naverMapLink(){
  var p = SITE.place || {};
  var u = safeUrl(p.naverMapUrl);
  if (u) return u;
  if (has(p.address)) return "https://map.naver.com/p/search/" + encodeURIComponent(p.address);
  return "";
}

/* ---------- 조각 만들기 ---------- */
function heroBlock(){
  var s = SITE.shop || {}, c = SITE.contact || {};
  var st = statusNow();
  var hasPhoto = has(s.hero);

  var statusHtml = "";
  if (st){
    statusHtml = '<div class="status ' + st.cls + '"><span class="dot"></span><span>' + esc(st.text)
      + (has(st.sub) ? ' <span style="font-weight:500;opacity:.85">· ' + esc(st.sub) + '</span>' : '')
      + '</span></div>';
  }

  var nameHtml = '<h1 class="t-hero">' + esc(s.name || "") + '</h1>'
    + (has(s.tagline) ? '<p class="tagline">' + nl(s.tagline) + '</p>' : '');

  /* 예약 링크가 있으면 그게 주 CTA, 없으면 길찾기 (방문형) */
  var acts = [];
  var km = kakaoMapLink();
  var bk = safeUrl(c.booking);
  if (bk){
    acts.push('<a class="btn btn-primary" href="' + esc(bk) + '" target="_blank" rel="noopener">' + I.cal + '예약하기</a>');
    if (km) acts.push('<a class="btn btn-ghost" href="' + esc(km) + '" target="_blank" rel="noopener">' + I.pin + '길찾기</a>');
    else if (has(c.phone)) acts.push('<a class="btn btn-ghost" href="' + esc(telUrl(c.phone)) + '">' + I.phone + '전화하기</a>');
  } else {
    if (km) acts.push('<a class="btn btn-primary" href="' + esc(km) + '" target="_blank" rel="noopener">' + I.pin + '길찾기</a>');
    if (has(c.phone)) acts.push('<a class="btn btn-ghost" href="' + esc(telUrl(c.phone)) + '">' + I.phone + '전화하기</a>');
  }
  var actsHtml = acts.length ? '<div class="hero-actions">' + acts.join("") + '</div>' : "";

  var noticeHtml = "";
  var n = activeNotice();
  if (n){
    var bits = [];
    if (has(n.reason)) bits.push(nl(n.reason));
    if (has(n.resumeDate)){
      var d = String(n.resumeDate).split("-");
      if (d.length === 3) bits.push(parseInt(d[1],10) + "월 " + parseInt(d[2],10) + "일부터 다시 엽니다.");
    }
    noticeHtml = '<div class="notice"><div class="nt">' + esc(n.label || "안내") + '</div>'
      + '<div class="nb">' + bits.join("<br>") + '</div></div>';
  }

  if (hasPhoto){
    /* 사진이 첫 화면을 꽉 채우고, 상호·영업 상태를 그 위에 얹는다 */
    return '<header class="hero has-photo">'
      + '<div class="hero-cover">'
      +   '<img src="' + esc(s.hero) + '" alt="' + esc(s.name || "") + ' 대표 사진" loading="eager">'
      +   '<div class="hero-veil"></div>'
      +   '<div class="hero-over"><div class="wrap">'
      +     (has(s.logo) ? '<img class="hero-logo on-photo" src="' + esc(s.logo) + '" alt="">' : "")
      +     statusHtml + nameHtml
      +   '</div></div>'
      + '</div>'
      + '<div class="wrap hero-below">' + actsHtml + noticeHtml + '</div>'
      + '</header>';
  }

  /* 사진이 없으면 빈 칸을 두지 않고, 색 있는 패널과 큰 글자로 채운다 */
  return '<header class="hero no-photo"><div class="hero-panel"><div class="wrap">'
    + (has(s.logo) ? '<img class="hero-logo" src="' + esc(s.logo) + '" alt="' + esc(s.name) + ' 로고">' : "")
    + statusHtml + nameHtml + actsHtml + noticeHtml
    + '</div></div></header>';
}

function quoteBlock(){
  var q = (SITE.shop || {}).quote;
  if (!has(q)) return "";
  var by = (SITE.shop || {}).quoteBy;
  return '<section id="sec-quote" class="reveal quote band"><div class="wrap">'
    + '<span class="mark">\u201C</span>'
    + '<p class="q">' + nl(q) + '</p>'
    + (has(by) ? '<div class="by">' + esc(by) + '</div>' : "")
    + '</div></section>';
}

function menuBlock(){
  var m = SITE.menu || {};
  var items = (m.items || []).filter(function(x){ return x && has(x.name); });
  if (!items.length) return "";

  /* 대표로 찍고 사진까지 있는 항목은 큰 카드로 따로 올린다 (최대 2개) */
  var cards = items.filter(function(x){ return x.signature && has(x.photo); }).slice(0, 2);
  var rest  = items.filter(function(x){ return cards.indexOf(x) === -1; });
  var withPhoto = rest.filter(function(x){ return has(x.photo); });
  var noPhoto   = rest.filter(function(x){ return !has(x.photo); });
  var sorted = withPhoto.concat(noPhoto);

  var h = '<section id="sec-menu" class="reveal"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">Menu</span>'
        + '<h2 class="t-sec">'+esc(m.title || "대표 메뉴")+'</h2></div>';

  if (cards.length){
    h += '<div class="m-cards">';
    cards.forEach(function(it){
      h += '<div class="m-card"><img src="'+esc(it.photo)+'" alt="'+esc(it.name)+'" loading="lazy">'
         + '<div class="c-body"><div class="c-name">'+esc(it.name)+'</div>'
         + (has(it.price) ? '<div class="c-price num">'+esc(it.price)+'</div>' : "")
         + (has(it.note) ? '<div class="c-note">'+esc(it.note)+'</div>' : "")
         + '</div></div>';
    });
    h += '</div>';
  }

  h += '<div class="menu-list">';

  sorted.forEach(function(it){
    h += '<div class="m-item'+(it.signature ? " is-signature" : "")+'">';
    if (has(it.photo)) h += '<img class="m-thumb" src="'+esc(it.photo)+'" alt="'+esc(it.name)+'" loading="lazy">';
    h += '<div class="m-main"><div class="m-top"><div class="m-name">'
       + (it.signature ? '<span class="badge">대표</span>' : '')
       + esc(it.name) + '</div>';
    if (has(it.price)) h += '<div class="m-price num">'+esc(it.price)+'</div>';
    h += '</div>';
    if (has(it.note)) h += '<div class="m-note">'+esc(it.note)+'</div>';
    h += '</div></div>';
  });
  h += '</div>';
  if (!sorted.length) h = h.replace('<div class="menu-list"></div>', '');

  if (has(m.priceNote)) h += '<p class="price-note">'+esc(m.priceNote)+'</p>';

  /* 포장 · 배달 */
  var t = SITE.takeout || {}, chips = [];
  if (t.packing) chips.push('<span class="chip">포장 가능</span>');
  if (t.delivery) chips.push('<span class="chip">배달 가능</span>');
  (t.links || []).forEach(function(l){
    var u = safeUrl(l && l.url);
    if (u && has(l.label)) chips.push('<a class="chip" href="'+esc(u)+'" target="_blank" rel="noopener">'+I.link+esc(l.label)+'</a>');
  });
  if (chips.length) h += '<div class="chips">'+chips.join("")+'</div>';

  /* 원산지 */
  var og = (SITE.origin || []).filter(function(x){ return x && has(x.item) && has(x.value); });
  if (og.length){
    h += '<details class="origin"><summary>원산지 표기</summary><div class="origin-body">';
    og.forEach(function(r){
      h += '<div class="origin-row"><span>'+esc(r.item)+'</span><span>'+esc(r.value)+'</span></div>';
    });
    h += '</div></details>';
  }

  h += '</div></section>';
  return h;
}

function galleryBlock(){
  var g = (SITE.gallery || []).filter(function(x){ return x && has(x.src); });
  if (!g.length) return "";
  var scroll = g.length >= 4;
  var h = '<section id="sec-photo" class="reveal"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">Photos</span><h2 class="t-sec">가게 사진</h2></div>'
        + '<div class="gal'+(scroll ? " scroll" : "")+'">';
  g.forEach(function(x){
    h += '<img src="'+esc(x.src)+'" alt="'+esc(x.alt || "가게 사진")+'" loading="lazy">';
  });
  h += '</div></div></section>';
  return h;
}

function ownerBlock(){
  var o = SITE.owner || {};
  if (!has(o.name) && !has(o.text) && !has(o.photo)) return "";

  var h = '<section id="sec-owner" class="reveal band"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">People</span><h2 class="t-sec">만드는 사람</h2></div>'
        + '<div class="owner">';
  if (has(o.photo)) h += '<img src="' + esc(o.photo) + '" alt="' + esc(o.name || "사장님") + '" loading="lazy">';
  h += '<div class="o-body">';
  if (has(o.name)) h += '<div class="o-name">' + esc(o.name) + '</div>';
  if (has(o.role)) h += '<div class="o-role">' + esc(o.role) + '</div>';
  if (has(o.text)) h += '<div class="o-text">' + nl(o.text) + '</div>';
  h += '</div></div></div></section>';
  return h;
}

function hoursBlock(){
  if (!hasHours()) return "";
  var hs = SITE.hours || {};
  var today = kstNow().wd;

  /* 월~일 차례로 보면서, 시간이 똑같이 이어지는 요일은 한 줄로 묶습니다.
     ("월 11-21 / 화 11-21 / ..." 다섯 줄 대신 "월–금 11-21" 한 줄) */
  var order = [1,2,3,4,5,6,0];
  var groups = [];
  order.forEach(function(wd){
    var p = plan(wd);
    var key = p ? [p.open, p.close, p.breakStart || "", p.breakEnd || ""].join("|") : "OFF";
    var last = groups[groups.length - 1];
    if (last && last.key === key) last.days.push(wd);
    else groups.push({ key: key, days: [wd], p: p });
  });

  var h = '<section id="sec-hours" class="reveal"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">Hours</span><h2 class="t-sec">영업시간</h2></div>'
        + '<div class="card">';

  groups.forEach(function(g){
    var label = g.days.length === 1
      ? DAYKR[g.days[0]]
      : DAYKR[g.days[0]] + "–" + DAYKR[g.days[g.days.length - 1]];
    var isToday = g.days.indexOf(today) !== -1;
    var cls = "hrow" + (isToday ? " today" : "") + (g.p ? "" : " off");

    h += '<div class="' + cls + '"><span class="d">' + label + '</span><span class="v num">';
    if (!g.p) h += '정기휴무';
    else {
      h += esc(g.p.open) + ' – ' + esc(g.p.close);
      if (has(g.p.breakStart) && has(g.p.breakEnd))
        h += '<span class="sub">브레이크타임 ' + esc(g.p.breakStart) + ' – ' + esc(g.p.breakEnd) + '</span>';
    }
    h += '</span></div>';
  });
  h += '</div>';

  var notes = [];
  if (has(hs.lastOrder)) notes.push("라스트오더 " + hs.lastOrder);
  if (has(hs.holidayNote)) notes.push(hs.holidayNote);
  if (notes.length) h += '<p class="hnote">' + esc(notes.join(" · ")) + '</p>';

  h += '</div></section>';
  return h;
}

function placeBlock(){
  var p = SITE.place || {};
  var info = (p.info || []).filter(function(x){ return x && has(x.label) && has(x.value); });
  if (!has(p.address) && !info.length && !has(p.mapImage)) return "";

  var h = '<section id="sec-place" class="reveal"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">Location</span><h2 class="t-sec">오시는 길</h2></div>'
        + '<div class="card place-card">';

  if (has(p.address)){
    h += '<div class="addr">'+esc(p.address)+'</div><div class="chips">';
    h += '<button type="button" class="chip" data-copy="'+esc(p.address)+'" data-msg="주소를 복사했어요">'+I.copy+'주소 복사</button>';
    var km = kakaoMapLink();
    if (km) h += '<a class="chip" href="'+esc(km)+'" target="_blank" rel="noopener">'+I.pin+'카카오맵</a>';
    var nm = naverMapLink();
    if (nm) h += '<a class="chip" href="'+esc(nm)+'" target="_blank" rel="noopener">'+I.pin+'네이버 지도</a>';
    h += '</div>';
  }
  if (has(p.mapImage)) h += '<div class="map-img"><img src="'+esc(p.mapImage)+'" alt="약도" loading="lazy"></div>';
  if (info.length){
    h += '<ul class="info-list">';
    info.forEach(function(x){ h += '<li><b>'+esc(x.label)+'</b><span>'+esc(x.value)+'</span></li>'; });
    h += '</ul>';
  }
  h += '</div></div></section>';
  return h;
}

function reviewBlock(){
  var r = (SITE.reviews || []).filter(function(x){ return x && has(x.text); });
  if (!r.length) return "";   /* 실제 후기가 없으면 섹션 자체가 나오지 않습니다 */
  var h = '<section id="sec-review" class="reveal band"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">Reviews</span><h2 class="t-sec">손님 후기</h2></div>';
  r.forEach(function(x){
    h += '<div class="rev"><p>'+nl(x.text)+'</p>';
    var meta = [];
    if (has(x.author)) meta.push(x.author);
    if (has(x.date)) meta.push(x.date);
    if (meta.length) h += '<div class="meta">'+esc(meta.join(" · "))+'</div>';
    h += '</div>';
  });
  h += '</div></section>';
  return h;
}

function contactBlock(){
  var c = SITE.contact || {}, btns = [];
  var bk0 = safeUrl(c.booking);
  if (bk0)
    btns.push('<a class="btn btn-primary" href="'+esc(bk0)+'" target="_blank" rel="noopener">'+I.cal+'예약하기</a>');
  if (has(c.phone))
    btns.push('<a class="btn '+(bk0 ? "btn-ghost" : "btn-primary")+'" href="'+esc(telUrl(c.phone))+'">'+I.phone+esc(c.phone)+'</a>');
  if (has(c.sms))
    btns.push('<a class="btn btn-ghost" href="sms:'+esc(String(c.sms).replace(/[^0-9+]/g,""))+'">'+I.sms+'문자 보내기</a>');
  var kk = safeUrl(c.kakaoChannel);
  if (kk)
    btns.push('<a class="btn btn-ghost" href="'+esc(kk.replace(/\/+$/,"") + "/chat")+'" target="_blank" rel="noopener">'+I.chat+'카톡으로 문의</a>');
  if (has(c.email))
    btns.push('<a class="btn btn-ghost" href="mailto:'+esc(c.email)+'">'+I.mail+esc(c.email)+'</a>');

  (SITE.links || []).forEach(function(l){
    var u = safeUrl(l && l.url);
    if (u && has(l.label))
      btns.push('<a class="btn btn-ghost" href="'+esc(u)+'" target="_blank" rel="noopener">'+I.link+esc(l.label)+'</a>');
  });

  if (!btns.length) return "";

  var h = '<section id="sec-contact" class="reveal"><div class="wrap">'
        + '<div class="sec-head"><span class="eyebrow">Contact</span><h2 class="t-sec">문의하기</h2></div>'
        + '<div class="contact-grid">'+btns.join("")+'</div>'
        + '<div class="share">'
        + '<button type="button" class="btn btn-ghost btn-sm" id="btn-share">'+I.share+'공유하기</button>'
        + '<button type="button" class="btn btn-ghost btn-sm" id="btn-copylink">'+I.copy+'링크 복사</button>'
        + '</div></div></section>';
  return h;
}

function footerBlock(){
  var s = SITE.shop || {}, L = SITE.legal || {}, c = SITE.contact || {}, p = SITE.place || {};
  var h = '<footer><div class="wrap">';
  h += '<div class="f-name">'+esc(s.name || "")+'</div>';
  var meta = [];
  if (has(p.address)) meta.push(esc(p.address));
  if (has(c.phone)) meta.push(esc(c.phone));
  if (has(L.bizName)) meta.push(esc(L.bizName));
  if (has(L.bizNumber)) meta.push("사업자등록번호 " + esc(L.bizNumber));
  var pu = safeUrl(L.privacyUrl);
  if (pu) meta.push('<a href="'+esc(pu)+'" target="_blank" rel="noopener">개인정보처리방침</a>');
  if (meta.length) h += '<div class="f-meta">'+meta.join("<br>")+'</div>';
  if (L.credit !== false) h += '<div class="credit">내 가게 홈페이지로 만들었습니다</div>';
  h += '</div></footer>';
  return h;
}

function stickyBlock(){
  var c = SITE.contact || {}, km = kakaoMapLink(), bk = safeUrl(c.booking);
  var parts = [];
  if (bk) parts.push('<a class="btn btn-primary lead" href="'+esc(bk)+'" target="_blank" rel="noopener">'+I.cal+'예약하기</a>');
  else if (km) parts.push('<a class="btn btn-primary lead" href="'+esc(km)+'" target="_blank" rel="noopener">'+I.pin+'길찾기</a>');
  if (has(c.phone)) parts.push('<a class="btn btn-ghost" href="'+esc(telUrl(c.phone))+'">'+I.phone+'전화</a>');
  else if (bk && km) parts.push('<a class="btn btn-ghost" href="'+esc(km)+'" target="_blank" rel="noopener">'+I.pin+'길찾기</a>');
  if (!parts.length) return "";
  return '<div class="sticky" id="sticky">'+parts.join("")+'</div>';
}

/* 위쪽 차례 막대 — 있는 칸만 모아서 만든다 */
function topnavBlock(){
  var map = [["sec-menu","메뉴"],["sec-photo","사진"],["sec-owner","소개"],
             ["sec-hours","영업시간"],["sec-place","오시는 길"],["sec-contact","문의"]];
  var links = [];
  map.forEach(function(m){
    if (document.getElementById(m[0])) links.push('<a href="#'+m[0]+'">'+m[1]+'</a>');
  });
  if (links.length < 3) return "";
  return '<nav class="topnav" id="topnav"><div class="nav-in">'+links.join("")+'</div></nav>';
}

/* ---------- 그리기 ---------- */
function render(){
  applyTheme();
  var html = "";
  if (SITE.demo){
    html += '<div class="demo-ribbon"><b>틀 미리보기</b> · 내용은 모양을 보려고 넣은 예시입니다. 빌더에서 받는 파일에는 이 줄이 없습니다.</div>';
  }
  html += heroBlock() + quoteBlock() + menuBlock() + galleryBlock() + ownerBlock() + hoursBlock()
        + placeBlock() + reviewBlock() + contactBlock() + footerBlock();

  document.getElementById("app").innerHTML = html;
  document.body.insertAdjacentHTML("beforeend", stickyBlock());
  document.body.insertAdjacentHTML("afterbegin", topnavBlock());

  /* 보이는 칸이 적으면 간격을 좁힌다 */
  var secCount = document.querySelectorAll("#app section").length;
  document.body.classList.toggle("lean", secCount <= 5);

  if (has(SITE.shop && SITE.shop.name)) document.title = SITE.shop.name;

  bind();
  revealOn();
  stickyOn();
}

function bind(){
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-copy]");
    if (t){ copy(t.getAttribute("data-copy"), t.getAttribute("data-msg")); return; }

    if (e.target.closest("#btn-copylink")){ copy(location.href, "링크를 복사했어요"); return; }

    if (e.target.closest("#btn-share")){
      var name = (SITE.shop && SITE.shop.name) || document.title;
      if (navigator.share){
        navigator.share({ title: name, url: location.href }).catch(function(){});
      } else {
        copy(location.href, "링크를 복사했어요");
      }
    }
  });
}

function revealOn(){
  var els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)){
    for (var i=0; i<els.length; i++) els[i].classList.add("in");
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
    });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
  for (var j=0; j<els.length; j++) io.observe(els[j]);
}

function stickyOn(){
  var el = document.getElementById("sticky");
  var nav = document.getElementById("topnav");
  var hero = document.querySelector("header.hero");
  var trigger = hero ? Math.max(260, hero.offsetHeight - 70) : 320;
  var onScroll = function(){
    var y = window.scrollY;
    if (el) el.classList.toggle("show", y > 320);
    if (nav) nav.classList.toggle("show", y > trigger);
  };
  window.addEventListener("scroll", onScroll, { passive:true });
  onScroll();
}

/* 상태 표시를 1분마다 새로 계산 */
function tick(){
  setInterval(function(){
    var st = statusNow(), box = document.querySelector(".status");
    if (!st || !box) return;
    box.className = "status " + st.cls;
    box.innerHTML = '<span class="dot"></span><span>' + esc(st.text)
      + (has(st.sub) ? ' <span style="font-weight:500;opacity:.85">· '+esc(st.sub)+'</span>' : '') + '</span>';
  }, 60000);
}

render();
tick();

/* 밝은↔어두운 화면이 바뀌면 색을 다시 계산 */
if (window.matchMedia){
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var onScheme = function(){ applyTheme(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme);
  else if (mq.addListener) mq.addListener(onScheme);
}
})();
</script>
</body>
</html>
