<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="카페 메뉴판 틀 미리보기 — 카페 이름, HOT·ICE 두 값 칸, 커피·논커피 묶음, 시그니처 표시">
  <rect width="640" height="360" fill="#FFF5EE"/>

  <!-- A4 종이 두 장 느낌 -->
  <rect x="158" y="26" width="328" height="308" rx="6" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>

  <!-- 머리: 카페 이름 + 굵은 밑줄 -->
  <text x="322" y="66" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#1A1A1A">○○커피</text>
  <rect x="246" y="76" width="152" height="4" rx="2" fill="#E9E5E1"/>
  <rect x="180" y="90" width="284" height="2.4" fill="#1A1A1A"/>

  <!-- HOT / ICE 칸 머리글 -->
  <rect x="380" y="100" width="26" height="4" rx="2" fill="#6E6A66" opacity="0.55"/>
  <rect x="428" y="100" width="24" height="4" rx="2" fill="#6E6A66" opacity="0.55"/>

  <!-- 묶음 1: 커피 -->
  <rect x="180" y="116" width="52" height="5" rx="2.5" fill="#D14E00"/>
  <rect x="240" y="118" width="224" height="1.4" fill="#E9E5E1"/>

  <!-- 줄 1 (시그니처) -->
  <g>
    <rect x="180" y="132" width="78" height="5.5" rx="2.75" fill="#1A1A1A"/>
    <rect x="264" y="130" width="38" height="12" rx="6" fill="#FFEBDD"/>
    <rect x="271" y="134.5" width="24" height="3.5" rx="1.75" fill="#D14E00"/>
    <rect x="180" y="143" width="146" height="3.6" rx="1.8" fill="#E9E5E1"/>
    <rect x="374" y="133" width="32" height="5" rx="2.5" fill="#1A1A1A"/>
    <rect x="422" y="133" width="32" height="5" rx="2.5" fill="#6E6A66" opacity="0.6"/>
  </g>
  <rect x="180" y="154" width="284" height="1" fill="#E9E5E1"/>

  <!-- 줄 2 -->
  <g>
    <rect x="180" y="162" width="66" height="5.5" rx="2.75" fill="#1A1A1A"/>
    <rect x="180" y="173" width="122" height="3.6" rx="1.8" fill="#E9E5E1"/>
    <rect x="374" y="163" width="32" height="5" rx="2.5" fill="#1A1A1A"/>
    <rect x="422" y="163" width="32" height="5" rx="2.5" fill="#6E6A66" opacity="0.6"/>
  </g>
  <rect x="180" y="184" width="284" height="1" fill="#E9E5E1"/>

  <!-- 줄 3 — ICE 만 (HOT 자리는 줄표) -->
  <g>
    <rect x="180" y="192" width="88" height="5.5" rx="2.75" fill="#1A1A1A"/>
    <rect x="180" y="203" width="136" height="3.6" rx="1.8" fill="#E9E5E1"/>
    <rect x="386" y="194" width="10" height="3" rx="1.5" fill="#6E6A66" opacity="0.45"/>
    <rect x="422" y="193" width="32" height="5" rx="2.5" fill="#6E6A66" opacity="0.6"/>
  </g>

  <!-- 묶음 2: 논커피 -->
  <rect x="180" y="226" width="68" height="5" rx="2.5" fill="#D14E00"/>
  <rect x="256" y="228" width="208" height="1.4" fill="#E9E5E1"/>
  <g>
    <rect x="180" y="242" width="74" height="5.5" rx="2.75" fill="#1A1A1A"/>
    <rect x="180" y="253" width="118" height="3.6" rx="1.8" fill="#E9E5E1"/>
    <rect x="374" y="243" width="32" height="5" rx="2.5" fill="#1A1A1A"/>
    <rect x="422" y="243" width="32" height="5" rx="2.5" fill="#6E6A66" opacity="0.6"/>
  </g>
  <rect x="180" y="264" width="284" height="1" fill="#E9E5E1"/>
  <g>
    <rect x="180" y="272" width="60" height="5.5" rx="2.75" fill="#1A1A1A"/>
    <rect x="374" y="273" width="32" height="5" rx="2.5" fill="#1A1A1A"/>
    <rect x="422" y="273" width="32" height="5" rx="2.5" fill="#6E6A66" opacity="0.6"/>
  </g>

  <!-- 안내 칸 -->
  <rect x="180" y="282" width="284" height="20" rx="5" fill="#FFF5EE" stroke="#E9E5E1" stroke-width="1.4"/>
  <rect x="188" y="287" width="200" height="3.4" rx="1.7" fill="#E9E5E1"/>
  <rect x="188" y="295" width="156" height="3.4" rx="1.7" fill="#E9E5E1"/>

  <!-- 영업시간 꼬리 -->
  <rect x="180" y="312" width="284" height="2" fill="#1A1A1A"/>
  <rect x="262" y="320" width="120" height="4" rx="2" fill="#E9E5E1"/>
</svg>
