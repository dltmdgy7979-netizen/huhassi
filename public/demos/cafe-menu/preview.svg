<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="카페 메뉴판 틀 미리보기 — 커피·논커피·디저트 세 묶음과 HOT·ICE 두 가격 칸">
  <rect width="640" height="360" fill="#FFF5EE"/>
  <!-- A4 종이 -->
  <rect x="166" y="22" width="308" height="316" rx="8" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>

  <!-- 머리 -->
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#1A1A1A">○○커피</text>
  <rect x="262" y="64" width="116" height="4" rx="2" fill="#E9E5E1"/>
  <line x1="188" y1="78" x2="452" y2="78" stroke="#1A1A1A" stroke-width="2"/>

  <!-- HOT / ICE 머리글 -->
  <text x="398" y="92" text-anchor="middle" font-family="sans-serif" font-size="7.5" letter-spacing="1.4" fill="#9A948E">HOT</text>
  <text x="440" y="92" text-anchor="middle" font-family="sans-serif" font-size="7.5" letter-spacing="1.4" fill="#9A948E">ICE</text>

  <!-- 묶음 1: 커피 -->
  <text x="188" y="110" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="1.6" fill="#D14E00">COFFEE</text>
  <line x1="248" y1="107" x2="452" y2="107" stroke="#E9E5E1" stroke-width="1"/>
  <g>
    <rect x="188" y="119" width="84" height="6" rx="3" fill="#1A1A1A" opacity="0.8"/>
    <rect x="278" y="118" width="40" height="8" rx="4" fill="#FFEBDD"/>
    <rect x="188" y="129" width="120" height="4" rx="2" fill="#E9E5E1"/>
    <rect x="378" y="120" width="34" height="5" rx="2.5" fill="#1A1A1A" opacity="0.7"/>
    <rect x="420" y="120" width="34" height="5" rx="2.5" fill="#D8D2CC"/>
  </g>
  <g>
    <rect x="188" y="146" width="66" height="6" rx="3" fill="#1A1A1A" opacity="0.8"/>
    <rect x="188" y="156" width="104" height="4" rx="2" fill="#E9E5E1"/>
    <rect x="378" y="147" width="34" height="5" rx="2.5" fill="#1A1A1A" opacity="0.7"/>
    <rect x="420" y="147" width="34" height="5" rx="2.5" fill="#D8D2CC"/>
  </g>
  <g>
    <rect x="188" y="173" width="74" height="6" rx="3" fill="#1A1A1A" opacity="0.8"/>
    <rect x="188" y="183" width="92" height="4" rx="2" fill="#E9E5E1"/>
    <rect x="378" y="174" width="34" height="5" rx="2.5" fill="#1A1A1A" opacity="0.7"/>
    <rect x="432" y="176" width="10" height="2.5" rx="1.25" fill="#D8D2CC"/>
  </g>

  <!-- 묶음 2: 논커피 -->
  <text x="188" y="208" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="1.6" fill="#D14E00">NON-COFFEE</text>
  <line x1="270" y1="205" x2="452" y2="205" stroke="#E9E5E1" stroke-width="1"/>
  <g>
    <rect x="188" y="217" width="78" height="6" rx="3" fill="#1A1A1A" opacity="0.8"/>
    <rect x="272" y="216" width="40" height="8" rx="4" fill="#FFEBDD"/>
    <rect x="188" y="227" width="112" height="4" rx="2" fill="#E9E5E1"/>
    <rect x="378" y="218" width="34" height="5" rx="2.5" fill="#1A1A1A" opacity="0.7"/>
    <rect x="420" y="218" width="34" height="5" rx="2.5" fill="#D8D2CC"/>
  </g>
  <g>
    <rect x="188" y="244" width="60" height="6" rx="3" fill="#1A1A1A" opacity="0.8"/>
    <rect x="188" y="254" width="88" height="4" rx="2" fill="#E9E5E1"/>
    <rect x="378" y="245" width="34" height="5" rx="2.5" fill="#1A1A1A" opacity="0.7"/>
    <rect x="420" y="245" width="34" height="5" rx="2.5" fill="#D8D2CC"/>
  </g>

  <!-- 묶음 3: 디저트 -->
  <text x="188" y="279" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="1.6" fill="#D14E00">DESSERT</text>
  <line x1="254" y1="276" x2="452" y2="276" stroke="#E9E5E1" stroke-width="1"/>
  <g>
    <rect x="188" y="288" width="68" height="6" rx="3" fill="#1A1A1A" opacity="0.8"/>
    <rect x="188" y="298" width="98" height="4" rx="2" fill="#E9E5E1"/>
    <rect x="378" y="289" width="34" height="5" rx="2.5" fill="#1A1A1A" opacity="0.7"/>
    <rect x="432" y="291" width="10" height="2.5" rx="1.25" fill="#D8D2CC"/>
  </g>

  <!-- 바닥: 영업시간 -->
  <line x1="188" y1="314" x2="452" y2="314" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="268" y="322" width="104" height="5" rx="2.5" fill="#D8D2CC"/>
</svg>
