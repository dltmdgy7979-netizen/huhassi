    <rect x="252" y="200" width="74" height="6" rx="3" fill="#1A1A1A" opacity="0.78"/>
    <rect x="252" y="210" width="54" height="4" rx="2" fill="#D8D2CC"/>
  </g>
  <g>
    <rect x="240" y="224" width="160" height="28" rx="12" fill="#FFFFFF" stroke="#FFD2B5" stroke-width="1.5"/>
    <rect x="252" y="232" width="62" height="6" rx="3" fill="#1A1A1A" opacity="0.78"/>
    <rect x="252" y="242" width="72" height="4" rx="2" fill="#D8D2CC"/>
  </g>
  <g>
    <rect x="240" y="256" width="160" height="28" rx="12" fill="#FFFFFF" stroke="#FFD2B5" stroke-width="1.5"/>
    <rect x="252" y="264" width="86" height="6" rx="3" fill="#1A1A1A" opacity="0.78"/>
    <rect x="252" y="274" width="58" height="4" rx="2" fill="#D8D2CC"/>
  </g>
  <g>
    <rect x="240" y="288" width="160" height="28" rx="12" fill="#FFFFFF" stroke="#FFD2B5" stroke-width="1.5"/>
    <rect x="252" y="296" width="70" height="6" rx="3" fill="#1A1A1A" opacity="0.78"/>
    <rect x="252" y="306" width="66" height="4" rx="2" fill="#D8D2CC"/>
  </g>
  <g opacity="0.55">
