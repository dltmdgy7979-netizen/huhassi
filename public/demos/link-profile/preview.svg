<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="링크 프로필 틀 미리보기 — 둥근 프로필 자리, 이름과 소개, 세로로 놓인 링크 단추 여섯 개">
  <rect width="640" height="360" fill="#FFF5EE"/>

  <!-- 휴대폰 화면 틀 -->
  <rect x="212" y="18" width="216" height="324" rx="22" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>

  <!-- 둥근 프로필 자리 -->
  <circle cx="320" cy="68" r="27" fill="#FFEBDD"/>
  <circle cx="320" cy="60" r="8.5" fill="#FF6A13" opacity="0.45"/>
  <path d="M320 95 a27 27 0 0 0 23.5 -13.8 a24 24 0 0 0 -47 0 A27 27 0 0 0 320 95 z" fill="#FF6A13" opacity="0.45"/>
  <circle cx="320" cy="68" r="27" fill="none" stroke="#FFFFFF" stroke-width="3"/>

  <!-- 이름 + 한 줄 소개 -->
  <rect x="288" y="104" width="64" height="7" rx="3.5" fill="#1A1A1A"/>
  <rect x="256" y="120" width="128" height="4" rx="2" fill="#E9E5E1"/>
  <rect x="276" y="130" width="88" height="4" rx="2" fill="#E9E5E1"/>

  <!-- 링크 단추 여섯 개 (첫 단추는 꽉 찬 색) -->
  <g>
    <rect x="228" y="148" width="184" height="30" rx="11" fill="#FF6A13"/>
    <rect x="240" y="156" width="92" height="5" rx="2.5" fill="#FFFFFF"/>
    <rect x="240" y="166" width="124" height="3.6" rx="1.8" fill="#FFFFFF" opacity="0.72"/>
  </g>
  <g fill="#FFFFFF" stroke="#FFD2B5" stroke-width="1.6">
    <rect x="228" y="183" width="184" height="30" rx="11"/>
    <rect x="228" y="218" width="184" height="30" rx="11"/>
    <rect x="228" y="253" width="184" height="30" rx="11"/>
    <rect x="228" y="288" width="184" height="30" rx="11"/>
  </g>
  <g fill="#1A1A1A">
    <rect x="240" y="191" width="80" height="5" rx="2.5"/>
    <rect x="240" y="226" width="98" height="5" rx="2.5"/>
    <rect x="240" y="261" width="72" height="5" rx="2.5"/>
    <rect x="240" y="296" width="90" height="5" rx="2.5"/>
  </g>
  <g fill="#E9E5E1">
    <rect x="240" y="201" width="112" height="3.6" rx="1.8"/>
    <rect x="240" y="236" width="128" height="3.6" rx="1.8"/>
    <rect x="240" y="271" width="104" height="3.6" rx="1.8"/>
    <rect x="240" y="306" width="118" height="3.6" rx="1.8"/>
  </g>

  <!-- 맨 아래 작은 글씨 -->
  <rect x="268" y="328" width="104" height="3.4" rx="1.7" fill="#E9E5E1"/>
</svg>
