<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="링크 프로필 틀 미리보기 — 둥근 사진 자리, 이름, 큼직한 링크 단추 여섯 개">
  <rect width="640" height="360" fill="#FFF5EE"/>
  <!-- 휴대폰 모양 -->
  <rect x="222" y="18" width="196" height="324" rx="26" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
  <rect x="294" y="30" width="52" height="6" rx="3" fill="#E9E5E1"/>

  <!-- 둥근 프로필 사진 자리 -->
  <circle cx="320" cy="78" r="26" fill="#FFEBDD" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="320" cy="70" r="8" fill="#FF6A13" opacity="0.45"/>
  <path d="M302 98 a18 16 0 0 1 36 0 z" fill="#FF6A13" opacity="0.45"/>

