<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="D-day 세기 — 이름과 날짜, 남은 날수가 적힌 카드 세 장">
  <rect width="640" height="360" fill="#FFFFFF"/>
  <rect x="0" y="0" width="640" height="54" fill="#FFF5EE"/>
  <circle cx="26" cy="27" r="7" fill="#FF6A13"/>
  <rect x="42" y="21" width="74" height="12" rx="6" fill="#1A1A1A"/>
  <rect x="540" y="18" width="76" height="18" rx="9" fill="#FFEBDD"/>
  <text x="578" y="31" font-family="sans-serif" font-size="10" font-weight="700" fill="#D14E00" text-anchor="middle">08</text>

  <!-- 더하는 줄 -->
  <rect x="24" y="72" width="268" height="34" rx="10" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="1.5"/>
  <text x="38" y="94" font-family="sans-serif" font-size="12" fill="#6E6A66">여행 가는 날</text>
  <rect x="302" y="72" width="192" height="34" rx="10" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="1.5"/>
  <text x="316" y="94" font-family="monospace" font-size="12" fill="#6E6A66">2026-12-04</text>
  <rect x="504" y="72" width="112" height="34" rx="17" fill="#FF6A13"/>
  <text x="560" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">더하기 Add</text>

  <!-- 카드 1: 남은 날 -->
  <rect x="24" y="124" width="188" height="148" rx="14" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="1.5"/>
  <circle cx="190" cy="142" r="12" fill="#FFFFFF" stroke="#D8D2CC"/>
  <path d="M185 137 l10 10 M195 137 l-10 10" stroke="#6E6A66" stroke-width="2" stroke-linecap="round"/>
  <text x="42" y="152" font-family="sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">여행 가는 날</text>
  <text x="42" y="170" font-family="monospace" font-size="10" fill="#6E6A66">2026-12-04 (금)</text>
  <text x="42" y="215" font-family="sans-serif" font-size="34" font-weight="800" fill="#D14E00">D-30</text>
  <text x="42" y="238" font-family="sans-serif" font-size="11" fill="#6E6A66">30일 남았습니다</text>
  <rect x="42" y="250" width="152" height="5" rx="2.5" fill="#FFEBDD"/>
  <rect x="42" y="250" width="54" height="5" rx="2.5" fill="#FF6A13"/>

  <!-- 카드 2: 오늘 -->
  <rect x="226" y="124" width="188" height="148" rx="14" fill="#FFF5EE" stroke="#FF6A13" stroke-width="1.5"/>
  <circle cx="392" cy="142" r="12" fill="#FFFFFF" stroke="#D8D2CC"/>
  <path d="M387 137 l10 10 M397 137 l-10 10" stroke="#6E6A66" stroke-width="2" stroke-linecap="round"/>
  <text x="244" y="152" font-family="sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">책 내는 날</text>
  <text x="244" y="170" font-family="monospace" font-size="10" fill="#6E6A66">2026-11-04 (수)</text>
  <text x="244" y="213" font-family="sans-serif" font-size="25" font-weight="800" fill="#D14E00">오늘이에요</text>
  <text x="244" y="236" font-family="sans-serif" font-size="11" fill="#6E6A66">It's today</text>
  <rect x="244" y="250" width="152" height="5" rx="2.5" fill="#FFEBDD"/>
  <rect x="244" y="250" width="152" height="5" rx="2.5" fill="#FF6A13"/>

  <!-- 카드 3: 지난 날 -->
  <rect x="428" y="124" width="188" height="148" rx="14" fill="#FDFCFB" stroke="#E9E5E1" stroke-width="1.5"/>
  <circle cx="594" cy="142" r="12" fill="#FFFFFF" stroke="#D8D2CC"/>
  <path d="M589 137 l10 10 M599 137 l-10 10" stroke="#6E6A66" stroke-width="2" stroke-linecap="round"/>
  <text x="446" y="152" font-family="sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">시작한 날</text>
  <text x="446" y="170" font-family="monospace" font-size="10" fill="#6E6A66">2026-07-27 (월)</text>
  <text x="446" y="215" font-family="sans-serif" font-size="34" font-weight="800" fill="#6E6A66">D+100</text>
  <text x="446" y="238" font-family="sans-serif" font-size="11" fill="#6E6A66">100일 지났습니다</text>
  <rect x="446" y="250" width="152" height="5" rx="2.5" fill="#E9E5E1"/>

  <!-- 아래 단추 -->
  <rect x="24" y="290" width="158" height="30" rx="15" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="1.5"/>
  <text x="103" y="310" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">JSON 내보내기</text>
  <rect x="192" y="290" width="158" height="30" rx="15" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="1.5"/>
  <text x="271" y="310" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">JSON 불러오기</text>
  <text x="370" y="310" font-family="sans-serif" font-size="11" fill="#6E6A66">이 브라우저에만 저장됩니다</text>
</svg>
