    <rect x="368" y="18" width="236" height="96" rx="14" fill="#FFF5EE" stroke="#E9E5E1" stroke-width="2"/>
    <text x="388" y="44" font-family="sans-serif" font-size="13" fill="#6E6A66">NEXT</text>
    <g>
      <rect x="408" y="58" width="18" height="18" rx="3" fill="#FF9A60"/>
      <rect x="428" y="58" width="18" height="18" rx="3" fill="#FF9A60"/>
      <rect x="388" y="78" width="18" height="18" rx="3" fill="#FF9A60"/>
