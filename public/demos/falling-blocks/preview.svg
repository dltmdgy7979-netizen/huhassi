<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="블록 쌓기 — 8칸 가로 16칸 높이의 좁은 통에 회색·주황 블록이 쌓여 있고, 오른쪽에 다음 블록과 점수, 그리고 직접 만든 여섯 가지 블록 모양(막대·네모·십자·갈고리·계단·ㄷ자)이 보입니다. Falling Blocks: a narrow 8 by 16 well with grey and orange blocks stacked up, next-block preview and score beside it, and the six custom block shapes shown below.">
  <rect width="640" height="360" fill="#FFFFFF"/>
  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#E9E5E1" stroke-width="2"/>

  <!-- 통: 8칸 × 16칸. 한 칸 18px → 144 × 288 -->
  <g transform="translate(26,30)">
    <rect x="-6" y="-6" width="156" height="300" rx="12" fill="#FFF5EE" stroke="#E9E5E1" stroke-width="2"/>
    <!-- 눈금 -->
    <g stroke="#F2E7DD" stroke-width="1">
      <path d="M18 0v288M36 0v288M54 0v288M72 0v288M90 0v288M108 0v288M126 0v288"/>
      <path d="M0 18h144M0 36h144M0 54h144M0 72h144M0 90h144M0 108h144M0 126h144M0 144h144M0 162h144M0 180h144M0 198h144M0 216h144M0 234h144M0 252h144M0 270h144"/>
    </g>

    <!-- 떨어지는 중인 ㄷ자 블록 (다섯 칸, 주황) -->
    <g fill="#B04200" stroke="rgba(26,26,26,.22)" stroke-width="1">
      <rect x="54.5" y="54.5" width="17" height="17" rx="2"/>
      <rect x="90.5" y="54.5" width="17" height="17" rx="2"/>
      <rect x="54.5" y="72.5" width="17" height="17" rx="2"/>
      <rect x="72.5" y="72.5" width="17" height="17" rx="2"/>
      <rect x="90.5" y="72.5" width="17" height="17" rx="2"/>
    </g>
    <!-- 떨어질 자리 미리 보기 -->
    <g fill="none" stroke="#D14E00" stroke-opacity=".45" stroke-width="2">
      <rect x="56" y="200" width="14" height="14"/>
      <rect x="92" y="200" width="14" height="14"/>
      <rect x="56" y="218" width="14" height="14"/>
      <rect x="74" y="218" width="14" height="14"/>
      <rect x="92" y="218" width="14" height="14"/>
    </g>

    <!-- 쌓인 블록 (아래 세 줄 + 한 줄은 가득 차서 곧 싹둑) -->
    <g stroke="rgba(26,26,26,.22)" stroke-width="1">
      <rect x="0.5" y="234.5" width="17" height="17" rx="2" fill="#FF9A60"/>
      <rect x="18.5" y="234.5" width="17" height="17" rx="2" fill="#FF9A60"/>
      <rect x="36.5" y="234.5" width="17" height="17" rx="2" fill="#6E6A66"/>
      <rect x="108.5" y="234.5" width="17" height="17" rx="2" fill="#D8D2CC"/>
      <rect x="126.5" y="234.5" width="17" height="17" rx="2" fill="#D8D2CC"/>

      <rect x="0.5" y="252.5" width="17" height="17" rx="2" fill="#D14E00"/>
      <rect x="18.5" y="252.5" width="17" height="17" rx="2" fill="#6E6A66"/>
      <rect x="36.5" y="252.5" width="17" height="17" rx="2" fill="#6E6A66"/>
      <rect x="54.5" y="252.5" width="17" height="17" rx="2" fill="#FF6A13"/>
      <rect x="90.5" y="252.5" width="17" height="17" rx="2" fill="#FF9A60"/>
      <rect x="108.5" y="252.5" width="17" height="17" rx="2" fill="#D8D2CC"/>
      <rect x="126.5" y="252.5" width="17" height="17" rx="2" fill="#B04200"/>

      <!-- 가득 찬 줄 — 번쩍이는 표시를 덮어씁니다 -->
      <rect x="0.5" y="270.5" width="17" height="17" rx="2" fill="#D14E00"/>
      <rect x="18.5" y="270.5" width="17" height="17" rx="2" fill="#FF6A13"/>
      <rect x="36.5" y="270.5" width="17" height="17" rx="2" fill="#FF9A60"/>
      <rect x="54.5" y="270.5" width="17" height="17" rx="2" fill="#6E6A66"/>
      <rect x="72.5" y="270.5" width="17" height="17" rx="2" fill="#D8D2CC"/>
      <rect x="90.5" y="270.5" width="17" height="17" rx="2" fill="#B04200"/>
      <rect x="108.5" y="270.5" width="17" height="17" rx="2" fill="#FF6A13"/>
      <rect x="126.5" y="270.5" width="17" height="17" rx="2" fill="#D14E00"/>
    </g>
    <rect x="0" y="270" width="144" height="18" fill="#FF6A13" fill-opacity=".3"/>

    <text x="72" y="-14" font-family="sans-serif" font-size="12" fill="#6E6A66" text-anchor="middle">8 × 16</text>
  </g>

  <!-- 오른쪽: 다음 블록과 점수 -->
  <g>
    <rect x="200" y="30" width="118" height="92" rx="12" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
    <text x="212" y="50" font-family="sans-serif" font-size="12" fill="#6E6A66">NEXT</text>
    <!-- 다음: 십자 (다섯 칸) -->
    <g fill="#FF6A13" stroke="rgba(26,26,26,.22)" stroke-width="1">
      <rect x="248.5" y="58.5" width="17" height="17" rx="2"/>
      <rect x="230.5" y="76.5" width="17" height="17" rx="2"/>
      <rect x="248.5" y="76.5" width="17" height="17" rx="2"/>
      <rect x="266.5" y="76.5" width="17" height="17" rx="2"/>
      <rect x="248.5" y="94.5" width="17" height="17" rx="2"/>
    </g>

    <rect x="336" y="30" width="276" height="92" rx="12" fill="#FFF5EE" stroke="#E9E5E1" stroke-width="2"/>
    <text x="352" y="54" font-family="sans-serif" font-size="13" fill="#6E6A66">SCORE</text>
    <text x="352" y="88" font-family="sans-serif" font-size="30" font-weight="800" fill="#1A1A1A">12 480</text>
    <text x="352" y="110" font-family="sans-serif" font-size="13" fill="#6E6A66">BEST 18 060</text>
    <text x="518" y="54" font-family="sans-serif" font-size="13" fill="#6E6A66">LEVEL</text>
    <text x="518" y="88" font-family="sans-serif" font-size="30" font-weight="800" fill="#D14E00">5</text>
  </g>

  <!-- 조작 단추 -->
  <g>
    <rect x="200" y="138" width="54" height="46" rx="14" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="2"/>
    <path d="M220 152 a11 11 0 1 1 -3 15" fill="none" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/>
    <path d="M220 146 v12 h-11 Z" fill="#FF6A13"/>
    <rect x="262" y="138" width="54" height="46" rx="14" fill="#FF6A13" stroke="#FF6A13" stroke-width="2"/>
    <text x="289" y="167" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">쿵</text>
    <rect x="200" y="192" width="54" height="46" rx="14" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="2"/>
    <path d="M234 215 l-14 -11 v22 Z" fill="#FF6A13"/>
    <rect x="262" y="192" width="54" height="46" rx="14" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="2"/>
    <path d="M289 226 l11 -14 h-22 Z" fill="#FF6A13"/>
  </g>

  <!-- 직접 만든 블록 여섯 모양 -->
  <g transform="translate(336,146)">
    <text x="0" y="10" font-family="sans-serif" font-size="12" fill="#6E6A66">여섯 모양 · six shapes</text>
    <g stroke="rgba(26,26,26,.22)" stroke-width="0.9">
      <!-- 막대 4칸 (회색 옅음) -->
      <g fill="#D8D2CC">
        <rect x="0.5" y="24.5" width="11" height="11" rx="1.5"/>
        <rect x="12.5" y="24.5" width="11" height="11" rx="1.5"/>
        <rect x="24.5" y="24.5" width="11" height="11" rx="1.5"/>
        <rect x="36.5" y="24.5" width="11" height="11" rx="1.5"/>
      </g>
      <!-- 네모 4칸 (회색 진함) -->
      <g fill="#6E6A66">
        <rect x="68.5" y="18.5" width="11" height="11" rx="1.5"/>
        <rect x="80.5" y="18.5" width="11" height="11" rx="1.5"/>
        <rect x="68.5" y="30.5" width="11" height="11" rx="1.5"/>
        <rect x="80.5" y="30.5" width="11" height="11" rx="1.5"/>
      </g>
      <!-- 십자 5칸 -->
      <g fill="#FF6A13">
        <rect x="124.5" y="12.5" width="11" height="11" rx="1.5"/>
        <rect x="112.5" y="24.5" width="11" height="11" rx="1.5"/>
        <rect x="124.5" y="24.5" width="11" height="11" rx="1.5"/>
        <rect x="136.5" y="24.5" width="11" height="11" rx="1.5"/>
        <rect x="124.5" y="36.5" width="11" height="11" rx="1.5"/>
      </g>
      <!-- 갈고리 5칸 -->
      <g fill="#D14E00">
        <rect x="168.5" y="12.5" width="11" height="11" rx="1.5"/>
        <rect x="168.5" y="24.5" width="11" height="11" rx="1.5"/>
        <rect x="168.5" y="36.5" width="11" height="11" rx="1.5"/>
        <rect x="180.5" y="36.5" width="11" height="11" rx="1.5"/>
        <rect x="192.5" y="36.5" width="11" height="11" rx="1.5"/>
      </g>
      <!-- 계단 5칸 -->
      <g fill="#FF9A60">
        <rect x="224.5" y="12.5" width="11" height="11" rx="1.5"/>
        <rect x="224.5" y="24.5" width="11" height="11" rx="1.5"/>
        <rect x="236.5" y="24.5" width="11" height="11" rx="1.5"/>
        <rect x="236.5" y="36.5" width="11" height="11" rx="1.5"/>
        <rect x="248.5" y="36.5" width="11" height="11" rx="1.5"/>
      </g>
      <!-- ㄷ자 5칸 -->
      <g fill="#B04200">
        <rect x="0.5" y="66.5" width="11" height="11" rx="1.5"/>
        <rect x="24.5" y="66.5" width="11" height="11" rx="1.5"/>
        <rect x="0.5" y="78.5" width="11" height="11" rx="1.5"/>
        <rect x="12.5" y="78.5" width="11" height="11" rx="1.5"/>
        <rect x="24.5" y="78.5" width="11" height="11" rx="1.5"/>
      </g>
    </g>
    <text x="56" y="80" font-family="sans-serif" font-size="12" fill="#1A1A1A">한 줄 가득 → </text>
    <text x="144" y="80" font-family="sans-serif" font-size="14" font-weight="800" fill="#D14E00">싹둑</text>
    <text x="190" y="80" font-family="sans-serif" font-size="12" fill="#6E6A66">Snip</text>
  </g>
</svg>
