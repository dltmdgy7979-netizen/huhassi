      <rect x="508" y="262" width="20" height="20" rx="3" fill="#FFEBDD" stroke="#FF6A13" stroke-width="2"/>
      <rect x="532" y="262" width="20" height="20" rx="3" fill="#FFEBDD" stroke="#FF6A13" stroke-width="2"/>
      <rect x="556" y="262" width="20" height="20" rx="3" fill="#FFEBDD" stroke="#FF6A13" stroke-width="2"/>
    </g>
    <path d="M388 304 h168" stroke="#FF6A13" stroke-width="3" stroke-linecap="round" stroke-dasharray="11 8"/>
    <text x="388" y="330" font-family="sans-serif" font-size="13" fill="#6E6A66">360px 휴대폰에서도 · phone ready</text>
