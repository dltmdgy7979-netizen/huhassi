    <path d="M66 272 l-14 -10 v20 Z" fill="#FF6A13"/>
    <rect x="92" y="252" width="46" height="40" rx="12" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="2"/>
    <path d="M108 272 l14 -10 v20 Z" fill="#FF6A13"/>
    <rect x="36" y="300" width="46" height="40" rx="12" fill="#FF6A13" stroke="#FF6A13" stroke-width="2"/>
    <path d="M52 312 a11 11 0 1 1 -4 9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M48 306 l6 3 l-6 4 Z" fill="#FFFFFF"/>
    <rect x="92" y="300" width="46" height="40" rx="12" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="2"/>
    <path d="M115 310 v14 l-8 -7 M115 324 l8 -7" fill="none" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/>
    <path d="M104 330 h22" stroke="#FF6A13" stroke-width="3" stroke-linecap="round"/>
