      <rect x="95" y="144" width="13" height="13" rx="2" fill="#FFCBA8"/><rect x="95" y="159" width="13" height="13" rx="2" fill="#FFCBA8"/><rect x="110" y="159" width="13" height="13" rx="2" fill="#FFCBA8"/><rect x="125" y="159" width="13" height="13" rx="2" fill="#FFCBA8"/>
    </g>
    <g>
      <rect x="66" y="192" width="13" height="13" rx="2" fill="#B04200"/><rect x="36" y="207" width="13" height="13" rx="2" fill="#B04200"/><rect x="51" y="207" width="13" height="13" rx="2" fill="#B04200"/><rect x="66" y="207" width="13" height="13" rx="2" fill="#B04200"/>
    </g>

    <!-- 조작 단추 -->
