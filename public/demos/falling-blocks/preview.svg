      <rect x="216" y="198" width="13" height="13" rx="2"/>
      <rect x="232" y="198" width="13" height="13" rx="2"/>
      <rect x="248" y="198" width="13" height="13" rx="2"/>
    </g>

    <!-- 쌓인 블록 -->
    <g>
      <rect x="183" y="245" width="15" height="15" rx="2" fill="#FFB488"/>
      <rect x="199" y="245" width="15" height="15" rx="2" fill="#FFB488"/>
      <rect x="295" y="245" width="15" height="15" rx="2" fill="#E65A09"/>
      <rect x="311" y="245" width="15" height="15" rx="2" fill="#E65A09"/>

      <rect x="183" y="261" width="15" height="15" rx="2" fill="#FFB488"/>
      <rect x="199" y="261" width="15" height="15" rx="2" fill="#FFB488"/>
      <rect x="215" y="261" width="15" height="15" rx="2" fill="#FFCBA8"/>
