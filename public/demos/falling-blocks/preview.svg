<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="블록 쌓기 — 세로로 긴 통 안에 주황 블록들이 쌓여 있고, 한 줄이 가득 차 번쩍이며, 오른쪽에 다음 블록과 점수가 보입니다. Falling Blocks: orange blocks stacked in a tall well with one full row highlighted, next piece and score at the side.">
  <rect width="640" height="360" fill="#FFFFFF"/>
  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#E9E5E1" stroke-width="2"/>

  <!-- 통: 10칸 × 20칸, 한 칸 16px -->
