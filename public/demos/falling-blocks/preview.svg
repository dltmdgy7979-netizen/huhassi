      <rect x="231" y="277" width="15" height="15" rx="2" fill="#FF9A60"/>
      <rect x="263" y="277" width="15" height="15" rx="2" fill="#B04200"/>
      <rect x="279" y="277" width="15" height="15" rx="2" fill="#B04200"/>
      <rect x="311" y="277" width="15" height="15" rx="2" fill="#FF6A13"/>

