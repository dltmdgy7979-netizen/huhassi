    <text x="470" y="48" font-family="sans-serif" font-size="13" fill="#6E6A66">SCORE</text>
    <text x="470" y="80" font-family="sans-serif" font-size="29" font-weight="800" fill="#1A1A1A">12 400</text>
    <text x="470" y="102" font-family="sans-serif" font-size="13" fill="#D14E00">LINES 38 · LEVEL 4</text>

    <rect x="368" y="130" width="236" height="212" rx="14" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
    <text x="388" y="162" font-family="sans-serif" font-size="14" fill="#6E6A66">한 줄을 가득 채우면</text>
    <text x="388" y="184" font-family="sans-serif" font-size="14" fill="#6E6A66">그 줄이 사라집니다</text>
    <text x="388" y="214" font-family="sans-serif" font-size="14" fill="#6E6A66">Fill a row and</text>
    <text x="388" y="236" font-family="sans-serif" font-size="14" fill="#6E6A66">it disappears</text>
    <g>
      <rect x="388" y="262" width="20" height="20" rx="3" fill="#FFEBDD" stroke="#FF6A13" stroke-width="2"/>
      <rect x="412" y="262" width="20" height="20" rx="3" fill="#FFEBDD" stroke="#FF6A13" stroke-width="2"/>
