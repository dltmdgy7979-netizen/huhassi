      <rect x="247" y="293" width="15" height="15" rx="2" fill="#FFB488"/>
      <rect x="263" y="293" width="15" height="15" rx="2" fill="#FF6A13"/>
      <rect x="279" y="293" width="15" height="15" rx="2" fill="#FF6A13"/>
      <rect x="295" y="293" width="15" height="15" rx="2" fill="#FFCBA8"/>
      <rect x="311" y="293" width="15" height="15" rx="2" fill="#FF6A13"/>

