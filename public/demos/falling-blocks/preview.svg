      <rect x="295" y="261" width="15" height="15" rx="2" fill="#E65A09"/>
      <rect x="311" y="261" width="15" height="15" rx="2" fill="#E65A09"/>

      <rect x="183" y="277" width="15" height="15" rx="2" fill="#D14E00"/>
      <rect x="199" y="277" width="15" height="15" rx="2" fill="#FFCBA8"/>
