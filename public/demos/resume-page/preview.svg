<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="이력서 틀 미리보기 — 인쇄 단추, 이름과 연락처, 핵심 역량 네 칸, 경력, 작업물 카드 세 개">
  <rect width="640" height="360" fill="#FFF5EE"/>

  <!-- 위에 붙은 인쇄 줄 -->
  <rect x="0" y="0" width="640" height="34" fill="#FFF5EE"/>
  <rect x="0" y="33" width="640" height="1.6" fill="#E9E5E1"/>
  <rect x="150" y="15" width="180" height="4" rx="2" fill="#E9E5E1"/>
  <rect x="384" y="8" width="106" height="20" rx="10" fill="#FF6A13"/>
  <rect x="400" y="16" width="74" height="4" rx="2" fill="#FFFFFF" opacity="0.92"/>

  <!-- 종이 -->
  <rect x="146" y="48" width="348" height="296" rx="12" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>

  <!-- 이름 + 한 줄 소개 + 굵은 밑줄 -->
  <text x="168" y="86" font-family="sans-serif" font-size="22" font-weight="700" fill="#1A1A1A">한지우</text>
  <rect x="168" y="94" width="150" height="5" rx="2.5" fill="#D14E00" opacity="0.85"/>
  <g fill="#E9E5E1">
    <rect x="168" y="108" width="68" height="4" rx="2"/>
    <rect x="246" y="108" width="54" height="4" rx="2"/>
    <rect x="310" y="108" width="48" height="4" rx="2"/>
    <rect x="368" y="108" width="62" height="4" rx="2"/>
  </g>
  <rect x="168" y="120" width="304" height="2.2" fill="#1A1A1A"/>

  <!-- 핵심 역량: 제목줄 + 네 칸 -->
  <rect x="168" y="134" width="50" height="4.5" rx="2.25" fill="#D14E00"/>
  <rect x="226" y="136" width="246" height="1.4" fill="#E9E5E1"/>
  <g fill="#FFF5EE" stroke="#E9E5E1" stroke-width="1.4">
    <rect x="168" y="148" width="146" height="34" rx="6"/>
    <rect x="326" y="148" width="146" height="34" rx="6"/>
    <rect x="168" y="188" width="146" height="34" rx="6"/>
    <rect x="326" y="188" width="146" height="34" rx="6"/>
  </g>
  <g fill="#1A1A1A">
    <rect x="178" y="157" width="80" height="4.5" rx="2.25"/>
    <rect x="336" y="157" width="68" height="4.5" rx="2.25"/>
    <rect x="178" y="197" width="72" height="4.5" rx="2.25"/>
    <rect x="336" y="197" width="86" height="4.5" rx="2.25"/>
  </g>
  <g fill="#E9E5E1">
    <rect x="178" y="167" width="124" height="3.4" rx="1.7"/>
    <rect x="178" y="174" width="92" height="3.4" rx="1.7"/>
    <rect x="336" y="167" width="118" height="3.4" rx="1.7"/>
    <rect x="336" y="174" width="80" height="3.4" rx="1.7"/>
    <rect x="178" y="207" width="112" height="3.4" rx="1.7"/>
    <rect x="178" y="214" width="86" height="3.4" rx="1.7"/>
    <rect x="336" y="207" width="124" height="3.4" rx="1.7"/>
    <rect x="336" y="214" width="74" height="3.4" rx="1.7"/>
  </g>

  <!-- 경력: 제목줄 + 회사 한 줄 + 불릿 -->
  <rect x="168" y="236" width="34" height="4.5" rx="2.25" fill="#D14E00"/>
  <rect x="210" y="238" width="262" height="1.4" fill="#E9E5E1"/>
  <rect x="168" y="250" width="62" height="5.5" rx="2.75" fill="#1A1A1A"/>
  <rect x="238" y="251" width="72" height="4" rx="2" fill="#E9E5E1"/>
  <rect x="402" y="251" width="70" height="4" rx="2" fill="#E9E5E1"/>
  <g fill="#E9E5E1">
    <circle cx="174" cy="264" r="2"/><rect x="182" y="262" width="252" height="3.6" rx="1.8"/>
    <circle cx="174" cy="274" r="2"/><rect x="182" y="272" width="222" height="3.6" rx="1.8"/>
  </g>

  <!-- 작업물 카드 세 개 -->
  <rect x="168" y="290" width="44" height="4.5" rx="2.25" fill="#D14E00"/>
  <rect x="220" y="292" width="252" height="1.4" fill="#E9E5E1"/>
  <g>
    <rect x="168" y="302" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="1.4"/>
    <rect x="175" y="308" width="82" height="14" rx="4" fill="#FFEBDD"/>
    <rect x="175" y="327" width="58" height="4.5" rx="2.25" fill="#1A1A1A"/>
    <rect x="272" y="302" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="1.4"/>
    <rect x="279" y="308" width="82" height="14" rx="4" fill="#FFEBDD"/>
    <rect x="279" y="327" width="70" height="4.5" rx="2.25" fill="#1A1A1A"/>
    <rect x="376" y="302" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="1.4"/>
    <rect x="383" y="308" width="82" height="14" rx="4" fill="#FFEBDD"/>
    <rect x="383" y="327" width="64" height="4.5" rx="2.25" fill="#1A1A1A"/>
