<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="2048 숫자 합치기 — 4×4 말판에 2, 4, 8 부터 2048 까지 숫자 칸이 놓여 있고, 옆에 점수·최고 점수·방향 단추·되돌리기 단추가 보입니다. 2048 number-merging game: a 4 by 4 board of numbered tiles with score, best score, direction buttons and an undo button beside it.">
  <rect width="640" height="360" fill="#FFFFFF"/>
  <rect x="0" y="0" width="640" height="360" fill="none" stroke="#E9E5E1" stroke-width="2"/>

  <!-- 말판 -->
  <g>
    <rect x="34" y="34" width="292" height="292" rx="18" fill="#FFF5EE" stroke="#E9E5E1" stroke-width="2"/>
    <!-- 1줄 -->
    <rect x="48" y="48" width="62" height="62" rx="9" fill="#FFF5EE" stroke="#E9E5E1" stroke-width="2"/>
    <text x="79" y="88" font-family="sans-serif" font-size="25" font-weight="800" fill="#1A1A1A" text-anchor="middle">2</text>
    <rect x="118" y="48" width="62" height="62" rx="9" fill="#FFEBDD"/>
    <text x="149" y="88" font-family="sans-serif" font-size="25" font-weight="800" fill="#1A1A1A" text-anchor="middle">4</text>
    <rect x="188" y="48" width="62" height="62" rx="9" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
    <rect x="258" y="48" width="62" height="62" rx="9" fill="#FFDCC4"/>
    <text x="289" y="88" font-family="sans-serif" font-size="25" font-weight="800" fill="#1A1A1A" text-anchor="middle">8</text>
    <!-- 2줄 -->
    <rect x="48" y="118" width="62" height="62" rx="9" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
    <rect x="118" y="118" width="62" height="62" rx="9" fill="#FFCBA8"/>
    <text x="149" y="157" font-family="sans-serif" font-size="21" font-weight="800" fill="#1A1A1A" text-anchor="middle">16</text>
    <rect x="188" y="118" width="62" height="62" rx="9" fill="#FFB488"/>
    <text x="219" y="157" font-family="sans-serif" font-size="21" font-weight="800" fill="#1A1A1A" text-anchor="middle">32</text>
    <rect x="258" y="118" width="62" height="62" rx="9" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
    <!-- 3줄 -->
    <rect x="48" y="188" width="62" height="62" rx="9" fill="#FF9A60"/>
    <text x="79" y="227" font-family="sans-serif" font-size="21" font-weight="800" fill="#1A1A1A" text-anchor="middle">64</text>
    <rect x="118" y="188" width="62" height="62" rx="9" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
    <rect x="188" y="188" width="62" height="62" rx="9" fill="#F2600D"/>
    <text x="219" y="226" font-family="sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">128</text>
    <rect x="258" y="188" width="62" height="62" rx="9" fill="#FFEBDD"/>
    <text x="289" y="228" font-family="sans-serif" font-size="25" font-weight="800" fill="#1A1A1A" text-anchor="middle">4</text>
    <!-- 4줄 -->
    <rect x="48" y="258" width="62" height="62" rx="9" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
    <rect x="118" y="258" width="62" height="62" rx="9" fill="#DC5505"/>
    <text x="149" y="296" font-family="sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">512</text>
    <rect x="188" y="258" width="62" height="62" rx="9" fill="#D14E00"/>
    <text x="219" y="295" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">1024</text>
    <rect x="258" y="258" width="62" height="62" rx="9" fill="#B04200"/>
    <text x="289" y="295" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">2048</text>
  </g>

  <!-- 오른쪽: 점수와 방향 단추 -->
  <g>
    <rect x="360" y="34" width="246" height="86" rx="14" fill="#FFF5EE" stroke="#E9E5E1" stroke-width="2"/>
    <text x="380" y="64" font-family="sans-serif" font-size="14" fill="#6E6A66">SCORE</text>
    <text x="380" y="99" font-family="sans-serif" font-size="32" font-weight="800" fill="#1A1A1A">6 820</text>
    <text x="520" y="64" font-family="sans-serif" font-size="14" fill="#6E6A66">BEST</text>
    <text x="520" y="99" font-family="sans-serif" font-size="32" font-weight="800" fill="#D14E00">9 104</text>

    <!-- 방향 단추 넷 -->
    <rect x="438" y="150" width="62" height="54" rx="14" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="2"/>
    <path d="M469 166 l13 16 h-26 Z" fill="#FF6A13"/>
    <rect x="368" y="214" width="62" height="54" rx="14" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="2"/>
    <path d="M385 241 l16 -13 v26 Z" fill="#FF6A13"/>
    <rect x="438" y="214" width="62" height="54" rx="14" fill="#FF6A13" stroke="#FF6A13" stroke-width="2"/>
    <path d="M469 254 l13 -16 h-26 Z" fill="#FFFFFF"/>
    <rect x="508" y="214" width="62" height="54" rx="14" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="2"/>
    <path d="M553 241 l-16 -13 v26 Z" fill="#FF6A13"/>

    <!-- 한 수 되돌리기 / 멈춤 단추 -->
    <rect x="368" y="282" width="112" height="44" rx="22" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="2"/>
    <path d="M390 302 a9 9 0 1 1 1 9" fill="none" stroke="#FF6A13" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M390 295 v10 h-10 Z" fill="#FF6A13"/>
    <text x="412" y="309" font-family="sans-serif" font-size="12" font-weight="700" fill="#1A1A1A">되돌리기</text>
    <rect x="490" y="282" width="80" height="44" rx="22" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="2"/>
    <rect x="508" y="296" width="5" height="16" rx="2" fill="#FF6A13"/>
    <rect x="517" y="296" width="5" height="16" rx="2" fill="#FF6A13"/>
    <text x="530" y="310" font-family="sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">P</text>
  </g>
</svg>
