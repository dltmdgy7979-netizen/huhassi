<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="이미지 압축 — 원래 사진과 줄인 사진을 나란히 보여 주는 화면">
  <rect width="640" height="360" fill="#FFFFFF"/>
  <rect x="0" y="0" width="640" height="54" fill="#FFF5EE"/>
  <circle cx="26" cy="27" r="7" fill="#FF6A13"/>
  <rect x="42" y="21" width="74" height="12" rx="6" fill="#1A1A1A"/>
  <rect x="540" y="18" width="76" height="18" rx="9" fill="#FFEBDD"/>
  <text x="578" y="31" font-family="sans-serif" font-size="10" font-weight="700" fill="#D14E00" text-anchor="middle">07</text>

  <!-- 점선 놓는 칸: 끌어다 놓기 · 붙여 넣기 · 고르기 -->
  <rect x="24" y="72" width="592" height="46" rx="12" fill="#FFF5EE" stroke="#D8D2CC" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M52 103 v-20 M43 91 l9-9 9 9" stroke="#FF6A13" stroke-width="3" stroke-linecap="round" fill="none"/>
  <text x="74" y="89" font-family="sans-serif" font-size="11" fill="#6E6A66">끌어다 놓기 · 붙여 넣기 (Ctrl+V)</text>
  <text x="74" y="106" font-family="sans-serif" font-size="11" fill="#6E6A66">Drag · paste · or choose</text>
  <rect x="488" y="82" width="112" height="26" rx="13" fill="#FF6A13"/>
  <text x="544" y="99" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">사진 고르기</text>

  <!-- 조절 막대 -->
  <rect x="24" y="132" width="180" height="5" rx="2.5" fill="#E9E5E1"/>
  <rect x="24" y="132" width="112" height="5" rx="2.5" fill="#FF6A13"/>
  <circle cx="136" cy="134.5" r="9" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/>
  <rect x="230" y="132" width="180" height="5" rx="2.5" fill="#E9E5E1"/>
  <rect x="230" y="132" width="140" height="5" rx="2.5" fill="#FF6A13"/>
  <circle cx="370" cy="134.5" r="9" fill="#FFFFFF" stroke="#FF6A13" stroke-width="3"/>
  <rect x="436" y="124" width="180" height="22" rx="8" fill="#FFFFFF" stroke="#D8D2CC" stroke-width="1.5"/>
  <text x="450" y="139" font-family="sans-serif" font-size="11" font-weight="700" fill="#1A1A1A">JPEG</text>
  <path d="M598 132 l6 7 6-7" stroke="#6E6A66" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 왼쪽: 원래 사진 -->
  <rect x="24" y="164" width="286" height="138" rx="12" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="1.5"/>
  <rect x="36" y="176" width="262" height="78" rx="8" fill="#FFF5EE" stroke="#E9E5E1"/>
  <circle cx="252" cy="200" r="16" fill="#FF6A13"/>
  <path d="M36 240 q58 -42 112 0 q52 -34 112 0 v14 h-224 z" fill="#FFEBDD"/>
  <path d="M36 246 q66 -30 124 2 q48 -24 138 4 v2 h-262 z" fill="#D14E00" opacity="0.35"/>
  <text x="36" y="272" font-family="sans-serif" font-size="11" fill="#6E6A66">4032 × 3024 px</text>
  <text x="36" y="292" font-family="sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">3,840 KB</text>

  <!-- 오른쪽: 줄인 사진 -->
  <rect x="330" y="164" width="286" height="138" rx="12" fill="#FFFCFA" stroke="#FF6A13" stroke-width="1.5"/>
  <rect x="342" y="176" width="262" height="78" rx="8" fill="#FFF5EE" stroke="#E9E5E1"/>
  <circle cx="558" cy="200" r="16" fill="#FF6A13"/>
  <path d="M342 240 q58 -42 112 0 q52 -34 112 0 v14 h-224 z" fill="#FFEBDD"/>
  <path d="M342 246 q66 -30 124 2 q48 -24 138 4 v2 h-262 z" fill="#D14E00" opacity="0.35"/>
  <text x="342" y="272" font-family="sans-serif" font-size="11" fill="#6E6A66">1600 × 1200 px</text>
  <text x="342" y="292" font-family="sans-serif" font-size="16" font-weight="700" fill="#D14E00">312 KB</text>

  <!-- 줄어든 비율 -->
  <rect x="24" y="314" width="592" height="30" rx="10" fill="#FFEBDD"/>
  <text x="320" y="334" font-family="sans-serif" font-size="14" font-weight="700" fill="#D14E00" text-anchor="middle">91.9% 줄었습니다 · 91.9% smaller</text>
</svg>
