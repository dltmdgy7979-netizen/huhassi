<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="공휴일 조회 MCP 미리보기 — 달력과 대화 풍선">
  <rect width="640" height="360" fill="#FFFFFF"/>
  <rect x="0" y="0" width="640" height="360" fill="#FFF5EE"/>

  <!-- 왼쪽: 달력 카드 -->
  <g>
    <rect x="34" y="52" width="258" height="258" rx="16" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
    <rect x="34" y="52" width="258" height="44" rx="16" fill="#FF6A13"/>
    <rect x="34" y="80" width="258" height="16" fill="#FF6A13"/>
    <text x="54" y="81" font-family="sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">10월</text>
    <text x="236" y="81" font-family="sans-serif" font-size="13" fill="#FFEBDD">2026</text>

    <!-- 요일 머리 -->
    <g font-family="sans-serif" font-size="11" fill="#6E6A66" text-anchor="middle">
      <text x="62" y="120">일</text><text x="96" y="120">월</text><text x="130" y="120">화</text>
      <text x="164" y="120">수</text><text x="198" y="120">목</text><text x="232" y="120">금</text>
      <text x="266" y="120">토</text>
    </g>

    <!-- 날짜 격자 (2026년 10월: 1일은 목요일) -->
    <g font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">
      <!-- 1주: 1 목 ~ 3 토 -->
      <text x="198" y="150">1</text><text x="232" y="150">2</text>
      <circle cx="266" cy="146" r="14" fill="#FF6A13"/><text x="266" y="150" fill="#FFFFFF" font-weight="700">3</text>
      <!-- 2주: 4 일 ~ 10 토, 9일 한글날 -->
      <text x="62" y="182">4</text><text x="96" y="182">5</text><text x="130" y="182">6</text>
      <text x="164" y="182">7</text><text x="198" y="182">8</text>
      <circle cx="232" cy="178" r="14" fill="#FFEBDD"/><text x="232" y="182" fill="#D14E00" font-weight="700">9</text>
      <text x="266" y="182">10</text>
      <!-- 3주 -->
      <text x="62" y="214">11</text><text x="96" y="214">12</text><text x="130" y="214">13</text>
      <text x="164" y="214">14</text><text x="198" y="214">15</text><text x="232" y="214">16</text>
      <text x="266" y="214">17</text>
      <!-- 4주 -->
      <text x="62" y="246">18</text><text x="96" y="246">19</text><text x="130" y="246">20</text>
      <text x="164" y="246">21</text><text x="198" y="246">22</text><text x="232" y="246">23</text>
      <text x="266" y="246">24</text>
      <!-- 5주 -->
      <text x="62" y="278">25</text><text x="96" y="278">26</text><text x="130" y="278">27</text>
      <text x="164" y="278">28</text><text x="198" y="278">29</text><text x="232" y="278">30</text>
      <text x="266" y="278">31</text>
    </g>
  </g>

  <!-- 오른쪽: 대화 풍선 -->
  <g font-family="sans-serif">
    <!-- 질문 -->
    <rect x="326" y="62" width="268" height="52" rx="14" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
    <text x="344" y="84" font-size="13" fill="#6E6A66">물음</text>
    <text x="344" y="103" font-size="13.5" fill="#1A1A1A">다음 공휴일 언제야?</text>

    <!-- 답 -->
    <rect x="326" y="128" width="268" height="86" rx="14" fill="#FFEBDD"/>
    <text x="344" y="150" font-size="13" fill="#D14E00" font-weight="700">MCP 답</text>
    <text x="344" y="172" font-size="13.5" fill="#1A1A1A">10월 3일 (토) 개천절,</text>
    <text x="344" y="192" font-size="13.5" fill="#1A1A1A">12일 뒤입니다.</text>

    <!-- 도구 칩 -->
    <g font-size="11.5" fill="#6E6A66">
      <rect x="326" y="234" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
      <text x="340" y="252" font-family="monospace" fill="#1A1A1A">list_holidays</text>

      <rect x="446" y="234" width="92" height="28" rx="14" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
      <text x="460" y="252" font-family="monospace" fill="#1A1A1A">is_holiday</text>

      <rect x="326" y="272" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#E9E5E1" stroke-width="2"/>
      <text x="338" y="290" font-family="monospace" fill="#1A1A1A">next_holiday</text>
    </g>

    <text x="326" y="36" font-size="12" font-family="monospace" fill="#D14E00">MCP · 14</text>
  </g>
</svg>
